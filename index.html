<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matemātikas eksāmena tests 9. klasei</title>
<meta name="description" content="Bezmaksas tests 9. klases matemātikas eksāmenam: 16 uzdevumi, rezultāts pa tēmām un demo nodarbības tavām vājākajām tēmām. Latviešu un krievu valodā.">
<meta property="og:title" content="Uzzini, kuras tēmas tev jāatkārto pirms matemātikas eksāmena">
<meta property="og:description" content="Bezmaksas tests: 16 eksāmena tipa uzdevumi, ~15 minūtes. Rezultāts pa tēmām un demo nodarbības.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Manrope:wght@700..800&family=Onest:wght@400..700&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: a math notebook. Squared-paper page, white "sheets" for the work, a red margin rule on task sheets. One column; a sidebar only in the demo course. */
  --bg: #F2F5FA;
  --grid: rgba(37, 72, 196, 0.07);
  --paper: #FFFFFF;
  --ink: #14213A;
  --muted: #56647C;
  --line: #DAE1EC;
  --soft: #EDF1F7;
  --accent: #2448C4;
  --accent-2: #1A389F;
  --on-accent: #FFFFFF;
  --accent-soft: #E6ECFF;
  --mark: #FFE15A;
  --margin: #E5484D;
  --c2: #D9480F;
  --c3: #0E8A6A;
  --good: #11744F; --good-bg: #E2F4EB;
  --warn: #9A5B00; --warn-bg: #FFF1D6;
  --bad: #B42F39; --bad-bg: #FCE8EA;
  --ball-r: #E5484D; --ball-b: #2F6FEB; --ball-g: #23A26B;
  --f-display: "Manrope", "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-hand: "Caveat", "Segoe Print", "Comic Sans MS", cursive;
  --r: 16px;
  --shadow: 0 1px 2px rgba(20, 33, 58, .05), 0 10px 30px rgba(20, 33, 58, .06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1320; --grid: rgba(150, 175, 230, 0.06); --paper: #131C2D; --ink: #E7ECF6; --muted: #9AA7BE; --line: #26324A; --soft: #1A2539;
    --accent: #8AA8FF; --accent-2: #A9C0FF; --on-accent: #0C1320; --accent-soft: #1D2A4A; --mark: rgba(255, 214, 10, .32); --margin: #F0656A;
    --c2: #FF8A4C; --c3: #3CC7A0; --good: #4CD39A; --good-bg: #12301F; --warn: #F2B24E; --warn-bg: #33270F; --bad: #FF7A83; --bad-bg: #3A161B;
    --ball-r: #F0656A; --ball-b: #6E9BFF; --ball-g: #3CC78A;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1320; --grid: rgba(150, 175, 230, 0.06); --paper: #131C2D; --ink: #E7ECF6; --muted: #9AA7BE; --line: #26324A; --soft: #1A2539;
  --accent: #8AA8FF; --accent-2: #A9C0FF; --on-accent: #0C1320; --accent-soft: #1D2A4A; --mark: rgba(255, 214, 10, .32); --margin: #F0656A;
  --c2: #FF8A4C; --c3: #3CC7A0; --good: #4CD39A; --good-bg: #12301F; --warn: #F2B24E; --warn-bg: #33270F; --bad: #FF7A83; --bad-bg: #3A161B;
  --ball-r: #F0656A; --ball-b: #6E9BFF; --ball-g: #3CC78A;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 76px; }
body {
  margin: 0; min-height: 100vh; display: flex; flex-direction: column;
  font: 400 17px/1.55 var(--f-body); color: var(--ink);
  background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  font-variant-numeric: tabular-nums;
}
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; letter-spacing: -0.015em; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(28px, 4.2vw, 44px); font-weight: 800; }
h2 { font-size: 24px; font-weight: 800; }
h3 { font-size: 20px; font-weight: 700; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.wrap { width: 100%; max-width: 1120px; margin: 0 auto; padding: 0 20px; }
.wrap.narrow { max-width: 720px; }
.wrap.mid { max-width: 980px; }
.wrap.wide { max-width: 1240px; }
main#view { flex: 1; padding: 28px 0 64px; }

/* header */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--paper) 90%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 20px; min-height: 62px; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.logo-mark { width: 36px; height: 36px; border-radius: 10px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font: 800 20px var(--f-display); position: relative; overflow: hidden; }
.logo-mark::after { content: ""; position: absolute; left: 8px; top: 0; bottom: 0; width: 2px; background: var(--margin); opacity: .9; }
.logo-txt { font: 800 17px/1.1 var(--f-display); }
.logo-txt small { display: block; font: 500 12.5px var(--f-body); color: var(--muted); }
.stepper { display: flex; gap: 6px; list-style: none; margin: 0 auto; padding: 0; }
.stepper li { display: flex; align-items: center; gap: 7px; font-size: 14px; color: var(--muted); padding: 4px 10px 4px 4px; border-radius: 99px; }
.stepper .sn { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--soft); font-weight: 700; font-size: 12.5px; }
.stepper li.now { color: var(--ink); background: var(--accent-soft); font-weight: 600; }
.stepper li.now .sn { background: var(--accent); color: var(--on-accent); }
.stepper li.done .sn { background: var(--good); color: var(--paper); }
.lang { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-left: auto; }
.stepper:not([hidden]) + .lang { margin-left: 0; }
.lang button { border: 0; background: transparent; padding: 7px 12px; font-weight: 700; font-size: 14px; cursor: pointer; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.preview-bar { background: var(--warn-bg); color: var(--warn); font-size: 14px; }
.preview-bar .wrap { display: flex; align-items: center; gap: 12px; min-height: 40px; }
.preview-bar span { flex: 1; }
.preview-bar button { border: 0; background: none; color: inherit; font-size: 20px; line-height: 1; cursor: pointer; padding: 4px 8px; }

/* basics */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 12px; padding: 12px 20px; font: 650 16px/1.2 var(--f-body); cursor: pointer; text-decoration: none; transition: background .15s, transform .1s; }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent-2); }
.btn-ghost { background: var(--soft); color: var(--ink); }
.btn-ghost:hover { background: color-mix(in srgb, var(--soft) 70%, var(--line)); }
.btn-lg { padding: 15px 24px; font-size: 17px; }
.btn.wide { width: 100%; }
.btn:disabled, .btn.disabled { opacity: .45; cursor: not-allowed; }
.btn-link { border: 0; background: none; color: var(--accent); padding: 4px 0; cursor: pointer; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.btn-link.inline { padding: 0; font-weight: 500; }
.btn-link.danger { color: var(--bad); }
.sheet { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 22px 24px; }
.sheet.nb { position: relative; padding-left: 58px; }
.sheet.nb::before { content: ""; position: absolute; left: 40px; top: 0; bottom: 0; width: 2px; background: var(--margin); opacity: .55; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); background: var(--soft); border-radius: 99px; padding: 4px 11px; text-decoration: none; }
.chip.link { color: var(--accent); background: var(--accent-soft); }
.chips { list-style: none; padding: 0; margin: 12px 0 18px; display: flex; flex-wrap: wrap; gap: 8px; }
.pill { display: inline-block; font: 700 12px/1 var(--f-body); letter-spacing: .02em; padding: 6px 10px; border-radius: 99px; white-space: nowrap; }
.pill.gap { background: var(--bad-bg); color: var(--bad); }
.pill.mid { background: var(--warn-bg); color: var(--warn); }
.pill.ok { background: var(--good-bg); color: var(--good); }
.ic { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); display: inline-grid; place-items: center; font: 800 15px var(--f-display); }
.m { font-weight: 600; white-space: nowrap; }
.m.big { font-size: 24px; font-weight: 650; letter-spacing: .01em; }
.center { text-align: center; }
.mk { background: linear-gradient(transparent 52%, var(--mark) 52%); padding: 0 .12em; }
.hand { font-family: var(--f-hand); font-size: 25px; color: var(--margin); font-weight: 600; white-space: nowrap; }
.fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .86em; line-height: 1.12; margin: 0 .12em; }
.fr i { font-style: normal; padding: 0 .2em; }
.fr i:first-child { border-bottom: 1.6px solid currentColor; }
.sys { display: inline-flex; align-items: center; gap: 4px; }
.sys .br { font-size: 2.3em; font-weight: 300; line-height: 1; margin-top: -.08em; }
.sys .rows { display: flex; flex-direction: column; line-height: 1.35; }
.eyebrow { font-size: 14px; font-weight: 600; color: var(--muted); }
.eyebrow b { color: var(--margin); white-space: nowrap; }
.eyebrow-s { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.lead { font-size: 19px; color: var(--ink); }
.note { font-size: 14px; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }

/* options */
.opts { display: grid; gap: 10px; margin-top: 16px; }
.opts-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: 2px solid var(--line); background: var(--paper); border-radius: 12px; padding: 11px 14px; font-size: 18px; font-weight: 550; cursor: pointer; transition: border-color .15s, background .15s; min-height: 56px; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .key { flex: 0 0 30px; height: 30px; border-radius: 8px; background: var(--soft); display: grid; place-items: center; font-weight: 700; font-size: 14px; color: var(--muted); }
.opt .ot { flex: 1; min-width: 0; }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt[aria-pressed="true"] .key { background: var(--accent); color: var(--on-accent); }
.opt[data-state="right"] { border-color: var(--good); background: var(--good-bg); }
.opt[data-state="right"] .key { background: var(--good); color: var(--paper); }
.opt[data-state="wrong"] { border-color: var(--bad); background: var(--bad-bg); }
.opt[data-state="wrong"] .ot { text-decoration: line-through; text-decoration-thickness: 1.5px; }
.opt:disabled { cursor: default; }
.fb:empty { display: none; }
.fb { margin-top: 14px; }
.good, .bad, .hintbox, .solbox { border-radius: 12px; padding: 12px 15px; font-size: 16px; }
.good { background: var(--good-bg); color: var(--ink); border-left: 4px solid var(--good); }
.good b { color: var(--good); margin-right: 4px; }
.bad { background: var(--bad-bg); color: var(--ink); border-left: 4px solid var(--bad); }
.hintbox { background: var(--warn-bg); border-left: 4px solid var(--warn); }
.solbox { background: var(--accent-soft); border-left: 4px solid var(--accent); font-weight: 550; }
.hint-s { font-size: 14px; color: var(--muted); }
.q-lv { font-size: 19px; font-weight: 600; }
.q-ru { font-size: 15.5px; color: var(--muted); margin-top: 3px; }
.qmath { margin-top: 10px; }
.figbox { margin: 14px 0 4px; display: flex; justify-content: center; }

/* landing */
.hero { display: grid; grid-template-columns: 1.08fr .92fr; gap: 44px; align-items: center; padding-top: 18px; padding-bottom: 12px; }
.hero-txt { display: flex; flex-direction: column; gap: 18px; }
.hero h1 { font-size: clamp(32px, 4.6vw, 52px); }
.cta-row { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 18px; }
.facts { list-style: none; display: flex; gap: 28px; padding: 0; margin: 4px 0 0; }
.facts li { display: flex; flex-direction: column; }
.facts b { font: 800 30px/1 var(--f-display); }
.facts span { font-size: 14px; color: var(--muted); }
.sample .sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.band { margin-top: 60px; }
.band > h2 { margin-bottom: 18px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.stat { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.stat b { font: 800 40px/1 var(--f-display); color: var(--bad); }
.stat b small { font-size: 22px; margin-left: 2px; }
.stat .meter { height: 6px; background: var(--soft); border-radius: 99px; overflow: hidden; }
.stat .meter i { display: block; height: 100%; background: var(--bad); border-radius: 99px; }
.stat p { font-size: 15px; }
.src { font-size: 13.5px; color: var(--muted); margin-top: 12px; }
.how { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.how li { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 6px; }
.how .hn { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--accent); color: var(--accent); display: grid; place-items: center; font: 800 15px var(--f-display); margin-bottom: 4px; }
.how p { font-size: 15px; color: var(--muted); }
.tchips { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.tchips li { display: flex; align-items: center; gap: 10px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-weight: 600; font-size: 15.5px; }
.parents { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
.parents p { max-width: 62ch; margin-top: 8px; color: var(--muted); }

/* form */
.form { display: flex; flex-direction: column; gap: 14px; }
.form h1 { font-size: 32px; }
.seg { border: 0; padding: 0; margin: 4px 0 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg legend { font-weight: 600; margin-bottom: 8px; padding: 0; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.seg span { display: block; text-align: center; border: 2px solid var(--line); border-radius: 12px; padding: 11px 10px; font-weight: 600; cursor: pointer; }
.seg input:checked + span { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.seg input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.parent-note { background: var(--soft); border-radius: 10px; padding: 10px 12px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 600; }
.opt-l { font-weight: 400; color: var(--muted); font-size: 14px; }
.field input, .numin, .relsel { border: 2px solid var(--line); background: var(--paper); border-radius: 12px; padding: 12px 14px; font-size: 17px; width: 100%; }
.field input:focus, .numin:focus, .relsel:focus { outline: none; border-color: var(--accent); }
.field input[aria-invalid="true"] { border-color: var(--bad); }
.err { color: var(--bad); font-size: 14px; min-height: 0; }
.err:empty { display: none; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 15.5px; cursor: pointer; }
.check input { width: 20px; height: 20px; margin-top: 2px; flex: 0 0 auto; accent-color: var(--accent); }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

/* test */
.test-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.tcount { font-weight: 700; }
.progress { height: 8px; background: var(--soft); border-radius: 99px; overflow: hidden; margin-bottom: 16px; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
.qcard { min-height: 300px; }
.dk { margin-top: 12px; border: 2px dashed var(--line); background: transparent; border-radius: 12px; padding: 10px 16px; font-weight: 600; color: var(--muted); cursor: pointer; width: 100%; }
.dk[aria-pressed="true"] { border-style: solid; border-color: var(--muted); color: var(--ink); background: var(--soft); }
.test-nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 16px; }
.nocalc { font-family: var(--f-hand); font-size: 20px; color: var(--margin); text-align: center; }

/* results */
.results { display: flex; flex-direction: column; gap: 18px; }
.res-head { display: flex; gap: 26px; align-items: center; }
.score { flex: 0 0 auto; width: 124px; height: 124px; border-radius: 50%; border: 6px solid var(--accent); display: flex; align-items: baseline; justify-content: center; padding-top: 34px; }
.score b { font: 800 44px/1 var(--f-display); }
.score span { font-size: 18px; color: var(--muted); margin-left: 3px; }
.res-head h1 { font-size: 30px; margin-bottom: 8px; }
.res-head .muted { margin-top: 6px; font-size: 15px; }
.res-grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 18px; align-items: start; }
.res-grid h2, .results > .sheet > h2 { margin-bottom: 14px; }
.trows { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; }
.trow { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.trow:first-child { border-top: 0; }
.tname { flex: 1; min-width: 0; }
.tname b { display: block; font-weight: 650; font-size: 16px; }
.tname small { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.35; }
.dots { display: flex; gap: 5px; }
.dots i { width: 12px; height: 12px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--good); }
.trow.gap .dots i:not(.on) { background: var(--bad); opacity: .45; }
.cta-card { position: sticky; top: 80px; display: flex; flex-direction: column; gap: 6px; border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
.cta-card .btn { margin-top: 6px; }
.cta-card .small { margin-top: 8px; }
.mis-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; }
.mis { border-left: 3px solid var(--bad); background: var(--soft); border-radius: 0 12px 12px 0; padding: 12px 16px; }
.mis.none { border-left-color: var(--good); }
.mis-h { display: flex; gap: 10px; align-items: center; margin-bottom: 6px; }
.mis-n { color: var(--muted); font-weight: 700; font-size: 14px; }
.mis-q { font-weight: 600; }
.mis-a { margin-top: 6px; font-size: 15.5px; }
.mis-a s { color: var(--bad); }
.mis-a b { color: var(--good); }
.mis-why { margin-top: 6px; }
.lbl { color: var(--muted); font-size: 14px; }
.review summary { cursor: pointer; font: 700 18px var(--f-display); }
.rev { list-style: none; padding: 0; margin: 16px 0 0; display: flex; flex-direction: column; gap: 12px; }
.rev li { display: flex; gap: 12px; }
.rn { flex: 0 0 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-weight: 700; font-size: 13px; background: var(--good-bg); color: var(--good); }
.r-bad .rn { background: var(--bad-bg); color: var(--bad); }
.r-a { font-size: 15px; margin-top: 3px; }
.r-x { font-size: 15px; color: var(--muted); }

/* demo */
.demo { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 30px; align-items: start; }
.side { position: sticky; top: 80px; display: flex; flex-direction: column; gap: 8px; max-height: calc(100vh - 100px); overflow: auto; padding-bottom: 8px; }
.side-h { font-size: 12.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 8px 0 2px; }
.side-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.side-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 12px; text-decoration: none; color: var(--ink); background: var(--paper); border: 1px solid var(--line); }
.side-item:hover { border-color: var(--accent); }
.side-item.on { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.side-t { flex: 1; min-width: 0; font-weight: 600; font-size: 14.5px; line-height: 1.25; }
.side-t small { display: block; color: var(--muted); font-weight: 500; font-size: 12.5px; margin-top: 2px; }
.side-cta { margin-top: 10px; background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; font-size: 15px; }
.lesson { display: flex; flex-direction: column; gap: 34px; min-width: 0; }
.side { min-width: 0; }
.vals { border-collapse: collapse; font-size: 19px; font-weight: 600; }
.vals th, .vals td { padding: 8px 16px; text-align: center; border-bottom: 1px solid var(--line); }
.vals thead th { color: var(--muted); font-size: 15px; }
.vals tbody th { color: var(--accent); text-align: left; }
.perm { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.perm li { background: var(--soft); border-radius: 10px; padding: 8px 14px; font-weight: 700; font-size: 20px; letter-spacing: .08em; }
.m.muted { color: var(--muted); font-weight: 500; }
.lesson-h .kicker { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; color: var(--muted); font-weight: 600; font-size: 14.5px; margin-bottom: 10px; }
.lesson-h h1 { font-size: clamp(26px, 3.4vw, 36px); }
.lsec > h2 { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; font-size: 22px; flex-wrap: wrap; }
.lsec > h2 .num { width: 32px; height: 32px; border-radius: 50%; background: var(--ink); color: var(--paper); display: grid; place-items: center; font-size: 15px; }
.solved-c { font: 600 14px var(--f-body); color: var(--muted); margin-left: auto; }
.player { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.p-top { display: flex; justify-content: space-between; align-items: center; padding: 9px 18px; border-bottom: 1px solid var(--line); background: var(--soft); }
.pcount { font-weight: 700; font-size: 14px; color: var(--muted); }
.pdots { display: flex; gap: 8px; }
.pdot { position: relative; width: 30px; height: 26px; border: 0; border-radius: 6px; background: none; cursor: pointer; padding: 0; }
.pdot::before { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 6px; margin-top: -3px; border-radius: 99px; background: var(--line); }
.pdot.on::before { background: var(--accent); }
.slide { padding: 22px 26px 6px; min-height: 280px; display: flex; flex-direction: column; gap: 12px; }
.slide p { max-width: 66ch; font-size: 17.5px; }
.slide-fig { margin: 8px 0 6px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.p-nav { display: flex; justify-content: space-between; padding: 14px 18px 18px; }
.figpair { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; width: 100%; }
.figpair .cap, .cap { text-align: center; font-weight: 600; font-size: 15px; margin-top: 4px; }
.flipdemo { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; }
.flipdemo .sg { display: inline-grid; place-items: center; width: 1.5em; height: 1.5em; border-radius: 50%; }
.flipdemo .sg.flip { background: var(--mark); color: var(--ink); }
.sysfig { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%; }
.formulas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; width: 100%; max-width: 520px; }
.formulas div { background: var(--soft); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.formulas b { font-size: 20px; font-weight: 650; }
.lv-term { font-size: 13.5px; color: var(--muted); }
.example .steps { margin: 16px 0 0; padding-left: 0; list-style: none; counter-reset: st; display: flex; flex-direction: column; gap: 10px; }
.example .steps li { counter-increment: st; position: relative; padding: 12px 14px 12px 50px; background: var(--soft); border-radius: 12px; animation: rise .25s ease-out; }
.example .steps li::before { content: counter(st); position: absolute; left: 14px; top: 11px; width: 26px; height: 26px; border-radius: 50%; background: var(--paper); border: 2px solid var(--accent); color: var(--accent); display: grid; place-items: center; font-weight: 800; font-size: 13px; }
@keyframes rise { from { transform: translateY(4px); opacity: .6; } to { transform: none; opacity: 1; } }
.task { margin-bottom: 14px; }
.task.solved { border-color: color-mix(in srgb, var(--good) 45%, var(--line)); }
.task-top { display: flex; gap: 12px; align-items: flex-start; }
.tnum { flex: 0 0 30px; height: 30px; border-radius: 8px; background: var(--ink); color: var(--paper); display: grid; place-items: center; font-weight: 700; }
.task.solved .tnum { background: var(--good); }
.tq { flex: 1; min-width: 0; }
.numrow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 14px; }
.numrow .pre { font-size: 20px; }
.numin { width: 150px; }
.relsel { width: 84px; font-size: 20px; padding: 10px; }
.unit { color: var(--muted); font-weight: 600; }
.ineq-prev { margin-top: 12px; background: var(--soft); border-radius: 12px; padding: 8px 10px 4px; }
.ineq-prev .cap { text-align: left; font-size: 13px; color: var(--muted); font-weight: 600; margin: 0 0 2px; }
.tools { display: flex; gap: 18px; margin-top: 10px; }
.course { display: flex; flex-direction: column; gap: 18px; }
.clist { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; counter-reset: c; }
.clist li { counter-increment: c; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); font-weight: 550; font-size: 15px; }
.clist li span::before { content: counter(c) ". "; color: var(--muted); }
.clist li small { font-size: 12px; font-weight: 700; white-space: nowrap; }
.clist li.in { background: var(--good-bg); border-color: transparent; }
.clist li.in small { color: var(--good); }
.clist li.lock small { color: var(--muted); }
.clist li.lock small::before { content: "🔒 "; }
.course-cta { display: flex; justify-content: space-between; align-items: center; gap: 20px; border-top: 1px solid var(--line); padding-top: 18px; }
.course-cta p { color: var(--muted); font-size: 15px; margin-top: 4px; max-width: 60ch; }

/* subscription */
.sub > h1 { margin-bottom: 8px; }
.sub-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 18px; align-items: start; margin-top: 22px; }
.pick { list-style: none; padding: 0; margin: 0 0 14px; display: flex; flex-direction: column; gap: 8px; }
.pick-i { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 2px solid var(--line); border-radius: 12px; cursor: pointer; }
.pick-i:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.pick-i input { width: 20px; height: 20px; accent-color: var(--accent); flex: 0 0 auto; }
.pick-t { flex: 1; font-weight: 600; }
.price-card { position: sticky; top: 80px; display: flex; flex-direction: column; gap: 10px; }
.price { display: flex; align-items: baseline; gap: 8px; }
.price b { font: 800 46px/1 var(--f-display); }
.price span { color: var(--muted); }
.calc { font-weight: 600; }
.deal { font-size: 14.5px; color: var(--accent); font-weight: 600; }
.incl { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
.incl li { padding-left: 24px; position: relative; }
.incl li::before { content: "✓"; position: absolute; left: 2px; color: var(--good); font-weight: 800; }
.price-card h3 { font-size: 16px; margin-top: 8px; }
.launch { font-size: 14.5px; background: var(--soft); border-radius: 12px; padding: 12px; margin-top: 4px; }
.fine { font-size: 13.5px; color: var(--muted); text-align: center; }
.thanks { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 36px 28px; }
.big-check { width: 64px; height: 64px; border-radius: 50%; background: var(--good-bg); color: var(--good); display: grid; place-items: center; font-size: 32px; font-weight: 800; }
.thanks .chips { justify-content: center; margin: 0; }
.small-p b { font-size: 26px; }

/* footer & modal */
footer { border-top: 1px solid var(--line); background: var(--paper); font-size: 14px; color: var(--muted); }
.foot-in { display: flex; justify-content: space-between; align-items: center; gap: 12px 24px; flex-wrap: wrap; padding-top: 18px; padding-bottom: 18px; }
.foot-act { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.reset-q { display: inline-flex; gap: 10px; align-items: center; }
#modal { position: fixed; inset: 0; z-index: 50; background: rgba(8, 14, 26, .55); display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal-card { background: var(--paper); color: var(--ink); border-radius: var(--r); max-width: 640px; width: 100%; max-height: 86vh; overflow: auto; padding: 22px 24px; box-shadow: 0 20px 60px rgba(0, 0, 0, .3); }
.modal-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; }
.modal-top h2 { min-width: 0; overflow-wrap: anywhere; }
.modal-x { flex-shrink: 0; width: 44px; height: 44px; padding: 0; font-size: 26px; line-height: 1; display: inline-flex; align-items: center; justify-content: center; }
@media (max-width: 480px) { .modal-top h2 { font-size: 22px; } .modal-card { padding: 18px 18px; } }
.pv dt { font-weight: 700; margin-top: 12px; }
.pv dd { margin: 3px 0 0; color: var(--muted); }

/* figures */
.fig { max-width: 100%; height: auto; display: block; overflow: visible; }
.fig .st { stroke: var(--ink); stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.fig .st.thin { stroke-width: 1.6; }
.fig .st.thick { stroke-width: 4; }
.fig .st.solid { fill: var(--soft); }
.fig .st.dash { stroke-dasharray: 6 6; stroke-width: 1.6; }
.fig .st.acc { stroke: var(--accent); stroke-width: 3; }
.fig .st.arc { stroke: var(--margin); stroke-width: 2.4; }
.fig .st.step { stroke: var(--margin); stroke-width: 2.4; stroke-dasharray: 5 5; }
.fig .axis { stroke: var(--muted); stroke-width: 1.8; }
.fig .tick { stroke: var(--muted); stroke-width: 1.5; }
.fig .grid { stroke: var(--line); stroke-width: 1; }
.fig .tx { fill: var(--ink); font: 600 17px var(--f-body); }
.fig .sm { font-size: 15px; font-weight: 600; fill: var(--muted); }
.fig .xs { font-size: 12.5px; font-weight: 500; fill: var(--muted); }
.fig .it { font-style: italic; }
.fig .big { font-size: 26px; font-weight: 700; }
.fig .vx { font-size: 18px; font-weight: 700; }
.fig .ang { fill: var(--margin); font-size: 17px; font-weight: 700; }
.fig .lab { font-size: 19px; font-weight: 700; }
.fig .lab-a { fill: var(--accent); font-size: 21px; font-weight: 800; font-style: italic; }
.fig .lab-b { fill: var(--c2); font-size: 21px; font-weight: 800; font-style: italic; }
.fig .lab-c { fill: var(--c3); font-size: 21px; font-weight: 800; font-style: italic; }
.fig .hand, .fig .hand-s { font-family: var(--f-hand); fill: var(--margin); font-size: 28px; font-weight: 600; }
.fig .hand-s { font-size: 24px; }
.fig .on-acc { fill: var(--on-accent); }
.fig .acc-t { fill: var(--accent); }
.fig .seg { stroke-width: 6; stroke-linecap: round; fill: none; }
.fig .seg-ar { fill: none; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
.fig .seg-a { stroke: var(--accent); } .fig .seg-b { stroke: var(--c2); } .fig .seg-c { stroke: var(--c3); }
.fig .pt-in, .fig .pt-out { stroke-width: 3; }
.fig .pt-in.pt-a { fill: var(--accent); stroke: var(--accent); } .fig .pt-out.pt-a { fill: var(--paper); stroke: var(--accent); }
.fig .pt-in.pt-b { fill: var(--c2); stroke: var(--c2); } .fig .pt-out.pt-b { fill: var(--paper); stroke: var(--c2); }
.fig .pt-in.pt-c { fill: var(--c3); stroke: var(--c3); } .fig .pt-out.pt-c { fill: var(--paper); stroke: var(--c3); }
.fig .curve { stroke: var(--accent); stroke-width: 3.4; fill: none; stroke-linejoin: round; }
.fig .tri { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 2.2; stroke-linejoin: round; }
.fig .tri-2 { fill: color-mix(in srgb, var(--c2) 14%, var(--paper)); }
.fig .tri-in { fill: none; stroke: var(--c2); stroke-width: 1.8; stroke-dasharray: 5 4; }
.fig .side { stroke-width: 4.5; stroke-linecap: round; }
.fig .side-a { stroke: var(--accent); } .fig .side-b { stroke: var(--c2); } .fig .side-c { stroke: var(--c3); }
.fig .dot { fill: var(--ink); }
.fig .cell { stroke: var(--paper); stroke-width: 3; }
.fig .c1 { fill: var(--accent-soft); } .fig .c2 { fill: color-mix(in srgb, var(--c2) 20%, var(--paper)); } .fig .c3 { fill: color-mix(in srgb, var(--c3) 22%, var(--paper)); }
.fig .bar-keep { fill: var(--accent); }
.fig .bar-cut { fill: none; stroke: var(--bad); stroke-width: 2; stroke-dasharray: 6 5; }
.fig .pan { fill: var(--soft); stroke: var(--ink); stroke-width: 2; }
.fig .body { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 2.2; }
.fig .top { fill: color-mix(in srgb, var(--accent) 22%, var(--paper)); stroke: var(--ink); stroke-width: 2.2; }
.fig .box { fill: var(--soft); stroke: var(--line); stroke-width: 2; }
.fig .ball { stroke: var(--paper); stroke-width: 2; }
.fig .ball-r { fill: var(--ball-r); } .fig .ball-b { fill: var(--ball-b); } .fig .ball-g { fill: var(--ball-g); }

/* survey on the results page */
.results > .survey > h2 { margin-bottom: 6px; }
.sv-opts { border: 0; padding: 0; margin: 16px 0 14px; display: flex; flex-wrap: wrap; gap: 8px; }
.sv-opt { position: relative; }
.sv-opt input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.sv-opt span { display: inline-flex; align-items: center; gap: 9px; border: 2px solid var(--line); border-radius: 99px; padding: 9px 15px; background: var(--paper); font-weight: 600; font-size: 15.5px; cursor: pointer; transition: border-color .15s, background .15s; }
.sv-opt span::before { content: ""; flex: 0 0 auto; width: 16px; height: 16px; border-radius: 5px; border: 2px solid var(--line); background: var(--paper); }
.sv-opt:hover span { border-color: var(--accent); }
.sv-opt input:checked + span { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.sv-opt input:checked + span::before { background: var(--accent); border-color: var(--accent); box-shadow: inset 0 0 0 3px var(--paper); }
.sv-opt input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.sv-other { max-width: 440px; margin-bottom: 14px; }
.survey .err { margin-bottom: 10px; }

/* exam cheat sheet for parents */
.ex-head { display: flex; flex-direction: column; gap: 12px; max-width: 780px; margin-bottom: 24px; }
.ex-grid { display: grid; grid-template-columns: 1.2fr .8fr; gap: 18px; align-items: start; }
.ex-grid h2 { margin-bottom: 12px; }
.xdates { list-style: none; padding: 0; margin: 0 0 14px; }
.xdates li { display: grid; grid-template-columns: 128px minmax(0, 1fr); gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); }
.xdates li:first-child { border-top: 0; padding-top: 2px; }
.xd { font: 800 17px/1.4 var(--f-display); color: var(--accent); white-space: nowrap; }
.xt b { display: block; font-weight: 650; line-height: 1.4; }
.xt small { display: block; margin-top: 3px; font-size: 14.5px; line-height: 1.45; color: var(--muted); }
.badge { display: inline-block; vertical-align: 2px; margin-left: 6px; padding: 4px 8px; border-radius: 99px; font: 700 11.5px/1 var(--f-body); letter-spacing: .05em; text-transform: uppercase; color: var(--c2); background: color-mix(in srgb, var(--c2) 13%, transparent); }
.xknow { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 16px; }
.xknow li { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 12px; align-items: baseline; }
.xknow b { font: 800 30px/1 var(--f-display); color: var(--bad); white-space: nowrap; }
.xknow p { font-size: 15.5px; }
.ex-cta { margin-top: 28px; border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
.ex-cta .btn { white-space: nowrap; flex: 0 0 auto; }
.ex-share { margin-top: 30px; }
.ex-share h2 { font-size: 18px; margin-bottom: 12px; }
.share-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.copied { font-size: 14.5px; font-weight: 600; color: var(--good); }
.ex-link { margin-top: 10px; font-weight: 650; }
.exams .src { margin-top: 26px; max-width: 80ch; }

/* responsive */
@media (max-width: 1100px) {
  .stepper .sl { display: none; }
  .stepper li { padding-right: 4px; }
}
@media (max-width: 980px) {
  .hero { grid-template-columns: 1fr; gap: 28px; }
  .stats, .how { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tchips { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .res-grid, .sub-grid, .ex-grid { grid-template-columns: 1fr; }
  .cta-card, .price-card { position: static; }
  .demo { grid-template-columns: minmax(0, 1fr); gap: 18px; }
  .side { position: static; max-height: none; overflow: visible; }
  .side-list { flex-direction: row; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x proximity; }
  .side-list li { flex: 0 0 auto; scroll-snap-align: start; }
  .side-item { max-width: 260px; }
  .side-cta { display: none; }
}
@media (max-width: 640px) {
  body { font-size: 16.5px; }
  .stepper { display: none !important; }
  .lang { margin-left: auto !important; }
  main#view { padding-top: 18px; }
  .sheet { padding: 18px 16px; }
  .sheet.nb { padding-left: 34px; }
  .sheet.nb::before { left: 20px; }
  .opts-2 { grid-template-columns: 1fr; }
  .stats, .how, .tchips { grid-template-columns: 1fr; }
  .facts { gap: 22px; }
  .parents, .course-cta { flex-direction: column; align-items: stretch; }
  .res-head { flex-direction: column; text-align: center; gap: 14px; }
  .test-nav .nocalc { display: none; }
  .figpair { grid-template-columns: 1fr; }
  .clist { grid-template-columns: 1fr; }
  .slide { padding: 18px 16px 4px; min-height: 0; }
  .p-nav { padding: 12px 16px 16px; }
  .m.big { font-size: 21px; }
  .q-lv { font-size: 18px; }
  .logo-txt small { display: none; }
  .solved-c { margin-left: 0; width: 100%; }
  .dots { display: none; }
  .trow { gap: 10px; }
  .xdates li { grid-template-columns: 1fr; gap: 2px; }
  .xknow li { grid-template-columns: 64px minmax(0, 1fr); }
  .ex-cta .btn { white-space: normal; }
  .xknow b { font-size: 25px; }
  .sv-opt span { font-size: 15px; padding: 8px 13px; }
}
@media print {
  .top, #footer, .preview-bar, .ex-share, .ex-cta .btn { display: none !important; }
  body { background: none; }
  main#view { padding: 0; }
  .sheet, .how li { box-shadow: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* narrated demo video */
.vid { margin: 0 0 18px; }
.vid video { display: block; width: 100%; aspect-ratio: 16 / 9; border-radius: 14px; background: #0f172a; box-shadow: 0 1px 0 var(--line), 0 10px 30px -18px rgba(15, 23, 42, .45); }
.vid figcaption { margin-top: 8px; font-size: 14px; color: var(--muted); }

/* ===== landing v2 (see DESIGN.md) ===== */
:root { --band: #14213A; --on-band: #F2F5FA; --shadow-lg: 0 30px 60px -30px rgba(20, 33, 58, .35), 0 2px 6px rgba(20, 33, 58, .06); }
:root[data-theme="dark"] { --band: #17213A; --shadow-lg: 0 30px 60px -30px rgba(0, 0, 0, .7); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --band: #17213A; --shadow-lg: 0 30px 60px -30px rgba(0, 0, 0, .7); } }
.btn-xl { padding: 16px 22px; font-size: 17px; border-radius: 14px; }
.btn-secondary { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn-secondary:hover { box-shadow: inset 0 0 0 1.5px var(--accent); color: var(--accent); }
.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.btn .play-ic { fill: currentColor; stroke: none; width: 16px; height: 16px; }
.btn-primary .arr { transition: transform .15s; } .btn-primary:hover .arr { transform: translateX(3px); }

.hero2 { padding: 56px 0 88px; }

// ---------- SVG figures (colors come from CSS tokens, so they follow light/dark theme) ----------
const MINUS = '−';
const fmtNum = v => {
  const r = Math.round(v * 1000) / 1000;
  return (r < 0 ? MINUS + String(-r) : String(r)).replace('.', ',');
};
const SV = {
  svg(w, h, inner, label = '') {
    return `<svg class="fig" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${label}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
  },
  ln: (x1, y1, x2, y2, c = 'st') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${c}"/>`,
  tx: (x, y, t, c = 'tx', a = 'middle') => `<text x="${x}" y="${y}" class="${c}" text-anchor="${a}">${t}</text>`,
  dot: (x, y, r = 5, c = 'dot') => `<circle cx="${x}" cy="${y}" r="${r}" class="${c}"/>`,
  path: (d, c = 'st') => `<path d="${d}" class="${c}"/>`,
  poly: (pts, c = 'st') => `<polyline points="${pts.map(p => p.join(',')).join(' ')}" class="${c}"/>`,
  arR: (x, y, c = 'st') => `<path d="M${x - 9},${y - 6} L${x},${y} L${x - 9},${y + 6}" class="${c}"/>`,
  arL: (x, y, c = 'st') => `<path d="M${x + 9},${y - 6} L${x},${y} L${x + 9},${y + 6}" class="${c}"/>`,
};

// Number line. segs: [{a, b, aIn, bIn, row, c}] where a/b may be ±Infinity; row 0 = on the axis.
function nl({ min = -6, max = 6, segs = [], w = 480, label = '' } = {}) {
  const rows = Math.max(0, ...segs.map(s => s.row || 0));
  const ay = 22 + rows * 20, h = ay + 34;
  const L = 18, R = w - 30, X = v => L + 16 + (v - min) / (max - min) * (R - L - 30);
  let s = SV.ln(L - 4, ay, R, ay, 'st axis') + SV.arR(R, ay, 'st axis') + SV.tx(w - 13, ay + 6, 'x', 'tx it');
  for (let v = min; v <= max; v++) s += SV.ln(X(v), ay - 5, X(v), ay + 5, 'st tick') + SV.tx(X(v), ay + 24, fmtNum(v), 'tx sm');
  segs.forEach(g => {
    const y = ay - (g.row || 0) * 20, c = g.c || 'a';
    const xa = g.a === -Infinity ? L + 2 : X(g.a), xb = g.b === Infinity ? R - 12 : X(g.b);
    s += SV.ln(xa, y, xb, y, `seg seg-${c}`).replace('<line ', `<line data-from="${g.a === -Infinity ? 'b' : 'a'}" data-row="${g.row || 0}" `);
    if (g.a === -Infinity) s += SV.arL(xa - 3, y, `seg-ar seg-${c}`);
    if (g.b === Infinity) s += SV.arR(xb + 3, y, `seg-ar seg-${c}`);
    if (isFinite(g.a)) s += SV.dot(X(g.a), y, 6.5, `${g.aIn ? 'pt-in' : 'pt-out'} pt-${c}`);
    if (isFinite(g.b)) s += SV.dot(X(g.b), y, 6.5, `${g.bIn ? 'pt-in' : 'pt-out'} pt-${c}`);
  });
  return SV.svg(w, h, s, label);
}

// Coordinate plane with optional functions, points and extra drawing (extra receives X, Y mappers).
function plot({ xmin, xmax, ymin, ymax, unit = 32, fns = [], pts = [], extra = null, label = '' }) {
  const pad = 26, w = (xmax - xmin) * unit + pad * 2, h = (ymax - ymin) * unit + pad * 2;
  const X = x => pad + (x - xmin) * unit, Y = y => pad + (ymax - y) * unit;
  let s = '';
  for (let x = Math.ceil(xmin); x <= xmax; x++) s += SV.ln(X(x), pad, X(x), h - pad, 'grid');
  for (let y = Math.ceil(ymin); y <= ymax; y++) s += SV.ln(pad, Y(y), w - pad, Y(y), 'grid');
  s += SV.ln(pad - 8, Y(0), w - pad + 10, Y(0), 'st axis') + SV.arR(w - pad + 10, Y(0), 'st axis');
  s += SV.ln(X(0), h - pad + 8, X(0), pad - 10, 'st axis') + `<path d="M${X(0) - 6},${pad - 1} L${X(0)},${pad - 10} L${X(0) + 6},${pad - 1}" class="st axis"/>`;
  s += SV.tx(w - pad + 6, Y(0) - 10, 'x', 'tx it') + SV.tx(X(0) + 12, pad - 4, 'y', 'tx it', 'start');
  for (let x = Math.ceil(xmin); x <= xmax; x++) if (x !== 0) s += SV.tx(X(x), Y(0) + 17, fmtNum(x), 'tx xs');
  for (let y = Math.ceil(ymin); y <= ymax; y++) if (y !== 0) s += SV.tx(X(0) - 7, Y(y) + 4, fmtNum(y), 'tx xs', 'end');
  s += SV.tx(X(0) - 7, Y(0) + 17, '0', 'tx xs', 'end');
  fns.forEach(fn => {
    const P = [];
    for (let i = 0; i <= 160; i++) {
      const x = fn.x0 + (fn.x1 - fn.x0) * i / 160, y = fn.f(x);
      if (y >= ymin - 0.3 && y <= ymax + 0.3) P.push([X(x).toFixed(1), Y(y).toFixed(1)]);
    }
    s += SV.poly(P, fn.c || 'curve');
  });
  if (extra) s += extra(X, Y);
  pts.forEach(p => {
    s += SV.dot(X(p.x), Y(p.y), 5.5, `pt-in pt-${p.c || 'a'}`);
    if (p.l) s += SV.tx(X(p.x) + (p.dx ?? 10), Y(p.y) + (p.dy ?? -10), p.l, 'tx sm', p.anchor || 'start');
  });
  return SV.svg(w, h, s, label);
}

// Right triangle: C bottom-left (right angle), A bottom-right, B top-left. Angle at A is `deg`.
function triFig({ deg = 30, A = 'A', B = 'B', C = 'C', ab = '', bc = '', ac = '', alpha = '', label = '', colored = false } = {}) {
  const Cx = 58, Cy = 196, Ax = 330, Ay = 196, Bx = 58, By = 196 - 272 * Math.tan(deg * Math.PI / 180);
  const r = 44, t = deg * Math.PI / 180;
  let s = `<polygon points="${Cx},${Cy} ${Ax},${Ay} ${Bx},${By.toFixed(1)}" class="tri"/>`;
  if (colored) {
    s += SV.ln(Bx, By, Cx, Cy, 'side side-a') + SV.ln(Cx, Cy, Ax, Ay, 'side side-b') + SV.ln(Ax, Ay, Bx, By, 'side side-c');
  }
  s += SV.path(`M${Cx + 16},${Cy} L${Cx + 16},${Cy - 16} L${Cx},${Cy - 16}`, 'st thin');
  s += SV.path(`M${Ax - r},${Ay} A${r},${r} 0 0 1 ${(Ax - r * Math.cos(t)).toFixed(1)},${(Ay - r * Math.sin(t)).toFixed(1)}`, 'st arc');
  if (alpha) s += SV.tx(Ax - r - 26, Ay - 9, alpha, 'tx ang');
  s += SV.tx(Ax + 14, Ay + 6, A, 'tx vx', 'start') + SV.tx(Bx - 14, By + 4, B, 'tx vx', 'end') + SV.tx(Cx - 14, Cy + 6, C, 'tx vx', 'end');
  const mx = (Ax + Bx) / 2, my = (Ay + By) / 2;
  if (ab) s += SV.tx(mx + 16, my - 12, ab, colored ? 'tx lab-c' : 'tx lab', 'start');
  if (bc) s += SV.tx(Bx - 14, (By + Cy) / 2 + 6, bc, colored ? 'tx lab-a' : 'tx lab', 'end');
  if (ac) s += SV.tx((Ax + Cx) / 2, Cy + 30, ac, colored ? 'tx lab-b' : 'tx lab');
  return SV.svg(380, 236, s, label);
}

// (a + b)² as an area model
function areaModel() {
  const o = 30, A = 150, B = 70;
  let s = '';
  s += `<rect x="${o}" y="${o}" width="${A}" height="${A}" class="cell c1"/>`;
  s += `<rect x="${o + A}" y="${o}" width="${B}" height="${A}" class="cell c2"/>`;
  s += `<rect x="${o}" y="${o + A}" width="${A}" height="${B}" class="cell c2"/>`;
  s += `<rect x="${o + A}" y="${o + A}" width="${B}" height="${B}" class="cell c3"/>`;
  s += SV.tx(o + A / 2, o + A / 2 + 8, 'a²', 'tx big') + SV.tx(o + A + B / 2, o + A / 2 + 6, 'ab', 'tx') + SV.tx(o + A / 2, o + A + B / 2 + 6, 'ab', 'tx') + SV.tx(o + A + B / 2, o + A + B / 2 + 6, 'b²', 'tx');
  s += SV.tx(o + A / 2, o - 10, 'a', 'tx it') + SV.tx(o + A + B / 2, o - 10, 'b', 'tx it') + SV.tx(o - 12, o + A / 2 + 6, 'a', 'tx it') + SV.tx(o - 12, o + A + B / 2 + 6, 'b', 'tx it');
  return SV.svg(o * 2 + A + B, o * 2 + A + B, s, '(a + b)²');
}

// Percent bar: 100 % = 40 €, 15 % taken away
function pctBar() {
  const x = 10, w = 440, y = 40, h = 44, cut = 0.15;
  let s = `<rect x="${x}" y="${y}" width="${w * (1 - cut)}" height="${h}" rx="8" class="bar-keep"/>`;
  s += `<rect x="${x + w * (1 - cut) + 4}" y="${y}" width="${w * cut - 4}" height="${h}" rx="8" class="bar-cut"/>`;
  s += SV.tx(x + w * (1 - cut) / 2, y + 28, '85 % = 34 €', 'tx on-acc');
  s += SV.tx(x + w * (1 - cut) + w * cut / 2 + 2, y + 28, '15 %', 'tx');
  s += SV.tx(x + w * (1 - cut) + w * cut / 2 + 2, y + h + 24, '6 €', 'tx sm');
  s += SV.tx(x, 24, '100 % = 40 €', 'tx', 'start');
  return SV.svg(460, 116, s, '100 % = 40 €');
}

// Balance scale for equations
function balance(left, right) {
  let s = SV.path('M210,190 L180,236 L240,236 Z', 'st solid');
  s += SV.ln(210, 190, 210, 64, 'st') + SV.ln(70, 64, 350, 64, 'st thick');
  s += SV.ln(90, 64, 70, 112, 'st thin') + SV.ln(90, 64, 110, 112, 'st thin') + SV.ln(330, 64, 310, 112, 'st thin') + SV.ln(330, 64, 350, 112, 'st thin');
  s += `<rect x="22" y="112" width="136" height="44" rx="10" class="pan"/>` + `<rect x="262" y="112" width="136" height="44" rx="10" class="pan"/>`;
  s += SV.tx(90, 141, left, 'tx') + SV.tx(330, 141, right, 'tx');
  s += SV.dot(210, 64, 6, 'dot');
  return SV.svg(420, 246, s, `${left} = ${right}`);
}

// Similar triangles: k = 2, the large one is split into 4 copies of the small one
function similarFig() {
  const s1 = [[30, 160], [110, 160], [58, 100]];
  const big = [[190, 196], [350, 196], [246, 76]];
  const mid = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
  const m1 = mid(big[0], big[1]), m2 = mid(big[1], big[2]), m3 = mid(big[2], big[0]);
  const pts = a => a.map(p => p.join(',')).join(' ');
  let s = `<polygon points="${pts(s1)}" class="tri"/>`;
  s += `<polygon points="${pts(big)}" class="tri tri-2"/>`;
  s += `<polygon points="${pts([m1, m2, m3])}" class="tri-in"/>`;
  s += SV.tx(70, 186, 'S', 'tx big') + SV.tx(270, 228, '4S', 'tx big');
  s += SV.tx(160, 40, 'k = 2', 'tx hand');
  return SV.svg(380, 240, s, 'k = 2');
}

// Cylinder with radius and height
function cylFig() {
  const cx = 150, rx = 80, ry = 22, top = 46, bot = 196;
  let s = `<path d="M${cx - rx},${top} L${cx - rx},${bot} A${rx},${ry} 0 0 0 ${cx + rx},${bot} L${cx + rx},${top}" class="body"/>`;
  s += `<ellipse cx="${cx}" cy="${top}" rx="${rx}" ry="${ry}" class="top"/>`;
  s += SV.path(`M${cx - rx},${bot} A${rx},${ry} 0 0 1 ${cx + rx},${bot}`, 'st dash');
  s += SV.ln(cx, bot, cx + rx, bot, 'st acc') + SV.dot(cx, bot, 4, 'dot');
  s += SV.tx(cx + rx / 2, bot - 8, 'r', 'tx it acc-t');
  s += SV.ln(cx + rx + 22, top, cx + rx + 22, bot, 'st thin') + SV.tx(cx + rx + 36, (top + bot) / 2 + 6, 'h', 'tx it', 'start');
  s += SV.ln(cx - rx, top, cx + rx, top, 'st thin dash') + SV.tx(cx, top - 30, 'd = 2r', 'tx sm');
  return SV.svg(300, 236, s, 'V = πr²h');
}

// Balls in a box: 4 red, 5 blue, 3 green
function ballsFig() {
  const cols = ['r', 'r', 'r', 'r', 'b', 'b', 'b', 'b', 'b', 'g', 'g', 'g'];
  let s = `<rect x="8" y="8" width="404" height="104" rx="16" class="box"/>`;
  cols.forEach((c, i) => { s += `<circle cx="${40 + i * 31}" cy="${i % 2 ? 72 : 52}" r="13" class="ball ball-${c}"/>`; });
  return SV.svg(420, 120, s, '4 + 5 + 3');
}

// Trig values without a calculator
function trigTable() {
  const r = (h, a, b, c) => `<tr><th>${h}</th><td>${a}</td><td>${b}</td><td>${c}</td></tr>`;
  return `<table class="vals"><thead><tr><th></th><th>30°</th><th>45°</th><th>60°</th></tr></thead><tbody>
    ${r('sin', '½', F('√2', 2), F('√3', 2))}${r('cos', F('√3', 2), F('√2', 2), '½')}${r('tg', F('√3', 3), '1', '√3')}</tbody></table>`;
}

// ---------- App ----------
const STORE = 'm9_state_v1';
const state = { lang: 'lv', lead: null, answers: [], idx: 0, done: false, demo: {}, slide: {}, steps: {}, sel: null, reserve: null, utm: null, pvHidden: false, sentResults: false, survey: null };
const mem = { resetAsk: false, sendTimer: null };

function save() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) { /* storage may be unavailable */ } }
function load() { try { const s = JSON.parse(localStorage.getItem(STORE) || 'null'); if (s && typeof s === 'object') Object.assign(state, s); } catch (e) { } }

const nb = s => (typeof s === 'string' ? s.replace(/(\d) (%|€|cm|см|min|мин)/g, '$1\u00A0$2') : s);
const L = x => nb(x == null ? '' : typeof x === 'string' ? x : (x[state.lang] ?? x.lv ?? ''));
const T = (k, vars) => {
  let s = I18N[state.lang][k] ?? I18N.lv[k] ?? k;
  if (vars && typeof s === 'string') for (const [a, b] of Object.entries(vars)) s = s.split('{' + a + '}').join(b);
  return Array.isArray(s) ? s.map(x => (Array.isArray(x) ? x.map(nb) : nb(x))) : nb(s);
};
// count-dependent text: the key holds [form for 1, 21, 31…, form for other numbers]; fits both lv and ru texts here
const plIdx = n => (n % 10 === 1 && n % 100 !== 11 ? 0 : 1);
const TN = (k, count, vars) => {
  const f = T(k), s = Array.isArray(f) ? f[Math.min(plIdx(count), f.length - 1)] : f;
  return Object.entries(vars || {}).reduce((acc, [x, y]) => acc.split('{' + x + '}').join(y), s);
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (s, el = document) => el.querySelector(s);
const topicById = id => TOPICS.find(t => t.id === id);

// ---------- dates & plurals ----------
function dateLong(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return state.lang === 'ru' ? `${d} ${MONTHS.ru.gen[m - 1]} ${y}` : `${y}. gada ${d}. ${MONTHS.lv.loc[m - 1]}`;
}
function dateShort(iso) {
  const [, m, d] = iso.split('-').map(Number);
  return state.lang === 'ru' ? `${d} ${MONTHS.ru.gen[m - 1]}` : `${d}. ${MONTHS.lv.loc[m - 1]}`;
}
function daysWord(n) {
  if (state.lang === 'ru') { const a = n % 10, b = n % 100; return a === 1 && b !== 11 ? 'день' : a >= 2 && a <= 4 && (b < 12 || b > 14) ? 'дня' : 'дней'; }
  return n % 10 === 1 && n % 100 !== 11 ? 'diena' : 'dienas';
}
function daysLeft() {
  const [y, m, d] = CONFIG.examDate.split('-').map(Number);
  const now = new Date(); const t0 = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.max(0, Math.round((Date.UTC(y, m - 1, d) - t0) / 86400000));
}

// ---------- lead sending ----------
function uid() {
  try { if (crypto.randomUUID) return crypto.randomUUID(); } catch (e) { }
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });
}
function send(stage, extra = {}) {
  const payload = { id: state.lead && state.lead.id, stage, lang: state.lang, site: location.origin + location.pathname, ...extra };
  if (!CONFIG.endpoint || !payload.id) { console.info('[preview] not sent:', payload); return; }
  try {
    fetch(CONFIG.endpoint, { method: 'POST', mode: 'no-cors', keepalive: true, headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) }).catch(() => { });
  } catch (e) { }
}
const answersCode = () => DIAG.map((_, i) => (state.answers[i] == null ? 4 : state.answers[i])).join('');

// ---------- results ----------
function results() {
  const per = {};
  TOPICS.forEach(t => (per[t.id] = { c: 0, n: 0 }));
  DIAG.forEach((d, i) => { const a = state.answers[i]; per[d.topic].n++; if (a != null && a < 4 && d.opts[a].ok) per[d.topic].c++; });
  const status = id => (per[id].c === per[id].n ? 'ok' : per[id].c === 0 ? 'gap' : 'mid');
  const score = Object.values(per).reduce((s, p) => s + p.c, 0);
  const rank = { gap: 0, mid: 1, ok: 2 };
  const order = TOPICS.map(t => t.id).sort((a, b) => rank[status(a)] - rank[status(b)]);
  const mistakes = DIAG.map((d, i) => ({ d, i, a: state.answers[i] })).filter(m => m.a != null && m.a < 4 && !m.d.opts[m.a].ok);
  const dk = state.answers.filter(a => a === 4).length;
  return { per, status, score, order, mistakes, dk, weak: order.filter(id => status(id) !== 'ok') };
}

function parseNum(s) {
  s = String(s ?? '').trim().replace(/\s+/g, '').replace(/[−–]/g, '-').replace(/,/g, '.').replace(/(€|cm²|cm³|cm|см²|см³|см|°|π)$/i, '');
  const fr = s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);
  if (fr) { const d = parseFloat(fr[2]); return d === 0 ? NaN : parseFloat(fr[1]) / d; }
  return /^-?(\d+\.?\d*|\.\d+)$/.test(s) ? parseFloat(s) : NaN;
}
const near = (a, b) => Math.abs(a - b) < 0.011;

  $('#f-name').setAttribute('aria-invalid', String(!!errs.name)); $('#f-email').setAttribute('aria-invalid', String(!!errs.email));
  const first = ['name', 'email', 'consent'].find(k => errs[k]);
  if (first) { const el = $(first === 'consent' ? '#f-consent' : '#f-' + first); el.focus({ preventScroll: true }); (el.closest('.field, .check') || el).scrollIntoView({ block: 'center' }); return; }
  const isNew = !state.lead || !state.lead.id;
  state.lead = { ...(state.lead || {}), id: (state.lead && state.lead.id) || uid(), role, name, email, phone, consent: true, news };
  save();
  if (!$('#f-web').value) send('contact', { role, name, email, phone, consent: true, news, utm: state.utm || {}, isNew });
  location.hash = 'tests';
}

// ---------- start ----------
function boot() {
  load();
  try {
    const q = new URLSearchParams(location.search);
    const l = q.get('l'); if (l === 'lv' || l === 'ru') state.lang = l;
    const utm = {}; ['utm_source', 'utm_medium', 'utm_campaign'].forEach(k => { const v = q.get(k); if (v) utm[k] = v.slice(0, 60); });
    if (Object.keys(utm).length && !state.utm) state.utm = utm;
    const r = q.get('r'), id = q.get('id');
    if (r && new RegExp(`^[0-4]{${DIAG.length}}$`).test(r)) {
      state.answers = r.split('').map(Number); state.done = true; state.idx = DIAG.length - 1; state.sentResults = true;
      if (id && /^[0-9a-f-]{36}$/i.test(id)) state.lead = (state.lead && state.lead.id === id) ? state.lead : { id };
    }
  } catch (e) { }
  save();
  window.addEventListener('hashchange', () => route());
  route();
}
boot();

</script>
