<script>
// ---------- helpers ----------
const INK = '#1F2430', BLUE = '#2F6FDE', RED = '#D7263D', GREEN = '#2A9D5B', ORANGE = '#E8820C', PURPLE = '#7B4FC9', GRID = '#E3E7EF';
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const r2 = v => Math.round(v * 100) / 100;
const fmt = v => String(r2(v)).replace('.', ',');
const eur = v => r2(v).toFixed(2).replace('.', ',');
const near = (a, b) => Math.abs(a - b) < 0.011;

// table: rows = [[head, ...cells], ...]; '?' cells highlighted
function vt(rows) {
  return `<table class="vt">${rows.map(r => `<tr><th>${r[0]}</th>${r.slice(1).map(c => `<td class="${c === '?' ? 'q' : ''}">${c}</td>`).join('')}</tr>`).join('')}</table>`;
}

// coordinate graph
function graph(o) {
  const W = o.w || 560, H = o.h || 330, L = 64, B = 50, T = 18, Rr = 20;
  const pw = W - L - Rr, ph = H - T - B;
  const X = x => L + x / o.xmax * pw, Y = y => T + ph - y / o.ymax * ph;
  let s = '';
  for (let x = 0; x <= o.xmax + 1e-9; x += o.xs) s += `<line x1="${X(x)}" y1="${T}" x2="${X(x)}" y2="${T + ph}" stroke="${GRID}"/>` + `<text x="${X(x)}" y="${T + ph + 20}" font-size="14" text-anchor="middle" fill="#4B5563">${fmt(x)}</text>`;
  for (let y = 0; y <= o.ymax + 1e-9; y += o.ys) s += `<line x1="${L}" y1="${Y(y)}" x2="${L + pw}" y2="${Y(y)}" stroke="${GRID}"/>` + `<text x="${L - 8}" y="${Y(y) + 5}" font-size="14" text-anchor="end" fill="#4B5563">${fmt(y)}</text>`;
  s += `<line x1="${L}" y1="${T + ph}" x2="${L + pw + 12}" y2="${T + ph}" stroke="${INK}" stroke-width="2.5"/><line x1="${L}" y1="${T + ph}" x2="${L}" y2="${T - 10}" stroke="${INK}" stroke-width="2.5"/>`;
  s += `<text x="${L + pw}" y="${H - 6}" font-size="14" font-weight="700" text-anchor="end" fill="${INK}">${o.xl}</text>`;
  s += `<text x="${L + 8}" y="${T + 2}" font-size="14" font-weight="700" text-anchor="start" fill="${INK}" >${o.yl}</text>`;
  (o.series || []).forEach(se => {
    s += `<polyline points="${se.pts.map(([x, y]) => X(x) + ',' + Y(y)).join(' ')}" fill="none" stroke="${se.c}" stroke-width="3.5" stroke-linejoin="round"/>`;
    if (se.dots !== false) s += se.pts.map(([x, y]) => `<circle cx="${X(x)}" cy="${Y(y)}" r="4.5" fill="${se.c}"/>`).join('');
    if (se.label) { const [x, y] = se.pts[se.pts.length - 1]; s += `<text x="${X(x) - 6}" y="${Y(y) - 10}" font-size="16" font-weight="800" text-anchor="end" fill="${se.c}">${se.label}</text>`; }
  });
  return `<svg class="fig" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${s}</svg>`;
}

// ---------- data ----------
const ZANE = [[0, 0], [4, 300], [8, 600], [12, 600], [14, 900], [16, 1000]];
const zAt = t => { for (let i = 1; i < ZANE.length; i++) { const [x0, y0] = ZANE[i - 1], [x1, y1] = ZANE[i]; if (t <= x1) return y0 + (y1 - y0) * (t - x0) / (x1 - x0); } return 1000; };
const RUD = [[0, 0], [5, 1500], [10, 3000], [15, 3000], [20, 5000]];

const FIG = {
  zane: graph({ xmax: 16, ymax: 1000, xs: 2, ys: 100, h: 360, xl: 't, min', yl: 's, m', series: [{ pts: ZANE, c: BLUE }] }),
  rud: graph({ xmax: 20, ymax: 5000, xs: 5, ys: 1000, xl: 't, min', yl: 's, m', series: [{ pts: RUD, c: PURPLE }] }),
  taps: graph({ xmax: 8, ymax: 160, xs: 1, ys: 20, xl: 't, s', yl: 'V, ml', series: [
    { pts: [[0, 0], [8, 40]], c: ORANGE, label: 'A', dots: false }, { pts: [[0, 0], [8, 80]], c: GREEN, label: 'B', dots: false }, { pts: [[0, 0], [8, 160]], c: BLUE, label: 'C', dots: false }] }),
  shirts: vt([['n (gab.)', 1, 2, 3, 4], ['S (€)', '14,50', '24,00', '33,50', '43,00']]),
};

// ---------- notes (конспект под видео) ----------
const NOTES = {
  vars: `<details class="note" open><summary>📒 Конспект: постоянные и переменные</summary>
  <p><b>Величина</b> <span class="lvt">(lielums)</span> — всё, что можно посчитать или измерить: время, деньги, литры, метры, проценты зарядки.</p>
  <div class="box life"><b>🛴 Пример из жизни: самокат Bolt</b>Минута стоит 0,10 €. Едешь 5 минут — платишь 0,50 €. Едешь 20 минут — 2,00 €.</div>
  <ul>
    <li><b>Постоянная величина</b> <span class="lvt">(nemainīgais lielums, konstante)</span> — НЕ меняется. Здесь: цена одной минуты, 0,10 €.</li>
    <li><b>Переменные величины</b> <span class="lvt">(mainīgie lielumi)</span> — меняются. Здесь: время поездки и плата.</li>
    <li><b>Независимая переменная</b> <span class="lvt">(neatkarīgais mainīgais)</span> — её <u>выбираем сами</u>: сколько минут ехать.</li>
    <li><b>Зависимая переменная</b> <span class="lvt">(atkarīgais mainīgais)</span> — <u>получается сама</u>, зависит от первой: сколько заплатим.</li>
  </ul>
  <div class="box rule"><b>✅ Волшебный вопрос</b>Спроси себя: «Что ОТ ЧЕГО зависит?» Плата зависит от времени → плата зависимая, время независимое.</div>
  <h3>Формула</h3>
  <p><span class="f">S = 0,10 · t</span>, где <b>t</b> — время в минутах, <b>S</b> — плата в евро.</p>
  <div class="box trap"><b>⚠️ Ловушка на контрольной</b>Всегда пиши, что значит каждая буква! «t — laiks minūtēs, S — samaksa eiro». Без этого снимают балл.</div>
  <h3>Меняем роли</h3>
  <p>У Эдмунда 2 €. На сколько минут хватит? Теперь мы знаем деньги и ищем время: <span class="f">t = S : 0,10</span> → 2 : 0,10 = <b>20 минут</b>. Теперь <b>деньги — независимая</b>, а <b>время — зависимая</b>.</p>
  <div class="box step"><b>💡 Как делить на 0,10</b>Делить на 0,10 — это то же самое, что умножить на 10. 2 : 0,10 = 2 · 10 = 20.</div></details>`,

  tiesi: `<details class="note" open><summary>📒 Конспект: прямая пропорциональность</summary>
  <div class="box life"><b>🍦 Пример из жизни</b>Мороженое стоит 0,80 €. 2 штуки — 1,60 €, 3 штуки — 2,40 €. Купил в 2 раза больше — заплатил в 2 раза больше.</div>
  <p><b>Прямо пропорциональные величины</b> <span class="lvt">(tieši proporcionāli lielumi)</span>: во сколько раз увеличивается одна — во столько же раз увеличивается другая.</p>
  <div class="box rule"><b>✅ Тест делением</b>Раздели в каждой строке одну величину на другую. Если частное ВСЕГДА одинаковое — прямая пропорциональность. Это число — <b>коэффициент</b> <span class="lvt">(proporcionalitātes koeficients)</span>.</div>

    { t: 'rēķina summa eiro', ok: true }, { t: 'izmantoto MB skaits', fb: 'Количество МБ мы выбираем — это независимая.' }, { t: 'cena par 1 MB', fb: 'Это постоянная.' }], explain: 'Сумма зависит от количества МБ.' },
  { id: 'f3', type: 'num', gen() { const c = R(3, 7), x2 = pick([34, 51, 102]), y3 = c * R(6, 15) + (c % 2 ? 0 : c / 2); return { fig: vt([['x', 5, x2, '?'], ['y', 5 * c, '?', y3]]), lv: `3. Lielumi x un y ir tieši proporcionāli. Aizpildi tabulu!`, ru: 'Прямая пропорциональность. Найди пропуски.', fields: [{ label: `x = ${x2} → y =`, ans: c * x2, unit: '' }, { label: `y = ${y3} → x =`, ans: y3 / c, unit: '' }],
    wrong: () => null, solution: `k = ${5 * c} : 5 = ${c};  y = ${c} · ${x2} = ${c * x2};  x = ${y3} : ${c} = ${fmt(y3 / c)}` }; } },
  { id: 'f4', type: 'choice', lv: '4. y = 3x. Ja y = 1⅓, tad x = ?', ru: 'Найди x.', opts: [
    { t: '4/9', ok: true }, { t: '4', fb: 'Ты умножил. Ищем x → делим на 3.' }, { t: '1/9', fb: 'Целую часть потеряли: 1⅓ = 4/3.' }, { t: '4/3', fb: 'Это просто y. Его ещё надо разделить на 3.' }], explain: '1⅓ = 4/3; 4/3 : 3 = 4/9.' },
  { id: 'f5', type: 'num', gen() { const a1 = pick([6, 4, 3]), a2 = 96; return { lv: `5. Visu taisnstūru laukums ir 48 cm². Aprēķini b, ja a = ${a1} cm un ja a = ${a2} cm.`, ru: 'Найди b в обоих случаях', fields: [{ label: `a = ${a1}: b =`, ans: 48 / a1, unit: 'cm' }, { label: `a = ${a2}: b =`, ans: 48 / a2, unit: 'cm' }],
    wrong: () => null, solution: `b = 48 : ${a1} = ${48 / a1};  b = 48 : 96 = 0,5` }; } },
  { id: 'f6', type: 'multi', lv: '6. b = 48 : a. Kādas vērtības nevar būt a?', ru: 'Какие значения не может принимать a?', opts: [
    { t: '0', ok: true }, { t: '−3', ok: true }, { t: '0,1', fb: 'Можно: b = 480.' }, { t: '5', fb: 'Можно: b = 9,6.' }] },
  { id: 'f7', type: 'num', gen() { return { fig: FIG.rud, lv: '7. Rūdolfa velobrauciena grafiks. Cik metrus viņš nobrauca pirmajās 10 minūtēs? Pēc cik minūtēm viņš bija nobraucis 1500 m?', ru: 'Прочитай график', fields: [{ label: 's (10 min) =', ans: 3000, unit: 'm' }, { label: 't (1500 m) =', ans: 5, unit: 'min' }],
    wrong: () => null, solution: '10 min → вверх → влево: 3000 m;  1500 m → вправо → вниз: 5 min' }; } },
  { id: 'f8', type: 'choice', fig: FIG.rud, lv: '8. Ko Rūdolfs darīja no 10. līdz 15. minūtei?', ru: 'Что делал Рудольф с 10 по 15 минуту?', opts: [
    { t: 'stāvēja', ok: true }, { t: 'brauca visātrāk', fb: 'Линия ровная — путь не меняется.' }, { t: 'brauca atpakaļ', fb: 'Тогда линия шла бы вниз.' }], explain: 'Горизонтальная линия — путь не меняется.' },
  { id: 'f9', type: 'num', gen() { const t = R(4, 12); return { lv: `9. No krāna katrā sekundē iztek 15 ml. Cik ml iztecēs ${t} sekundēs?`, ru: 'Найди объём', fields: [{ label: 'V =', ans: 15 * t, unit: 'ml' }], wrong: () => null, solution: `V = 15 · ${t} = ${15 * t} ml` }; } },
  { id: 'f10', type: 'num', gen() { const n = R(3, 9); return { fig: vt([['n', 1, 2, 3], ['S, €', 10, 17, 24]]), lv: `10. Picērija: picas cena ar piegādi. Uzraksti formulu un aprēķini, cik maksā ${n} picas un 200 picas.`, ru: 'Найди закономерность (S = 7n + 3) и посчитай', fields: [{ label: `${n} picas:`, ans: 7 * n + 3, unit: '€' }, { label: '200 picas:', ans: 1403, unit: '€' }],
    wrong: () => 'Прирост: 17 − 10 = 7 € за пиццу. 1 пицца 10 €, значит доставка 10 − 7 = 3 €. S = 7n + 3.', solution: `S = 7n + 3;  7 · ${n} + 3 = ${7 * n + 3} €;  7 · 200 + 3 = 1403 €` }; } },
  { id: 'f11', type: 'ai', lv: '11. Taksometrs: iekāpšana 1,50 € un 0,90 € par katru km. Uzraksti formulu samaksai un paskaidro, ko nozīmē katrs burts!', ru: 'Напиши формулу и объясни буквы.',
    rubric: 'Верная формула: S = 0,9x + 1,5 (буквы могут быть другими, например S = 0,90·k + 1,50). Обязательно: объяснение, что значит каждая буква (S — плата в евро, x — километры). Засчитать при верной формуле И объяснении обеих букв. Формула S = 0,9x без +1,5 — неверно. S = 2,4x — неверно.',
    model: 'S = 0,9x + 1,5, kur S — samaksa eiro, x — nobrauktie kilometri.' },
]};
</script>

<script>
// ================== state ==================
const ALL = [...BLOCKS.slice(0, -1), BLOCKS[BLOCKS.length - 1], FINAL];
const TASKS = {}; ALL.forEach(b => b.tasks.forEach(t => { TASKS[t.id] = { ...t, block: b.id }; }));
const LS_KEY = 'sakaribas7-lesson-v1';
let state = { answers: {}, watched: {}, cur: 'intro', questions: [], startedAt: Date.now(), updatedAt: Date.now() };
const inst = {};      // generated numeric tasks
const ui = {};        // transient per-task ui state
let lastTask = null, lastAnswer = '';
let DB = null, DOC = null, SAMPLE = null, USER = null, isOwner = false;
try { const s = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); if (s && s.answers) state = { ...state, ...s }; } catch (e) {}

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const blockById = id => ALL.find(b => b.id === id);
const ans = id => state.answers[id] || (state.answers[id] = { done: false, firstTry: null, attempts: 0, wrong: [] });

// ================== persistence ==================
let saveTimer = null, saving = Promise.resolve();
function save() {
  state.updatedAt = Date.now();
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    if (!DOC) return;
    const snap = JSON.parse(JSON.stringify(state));
    saving = saving.then(() => DOC.set(snap)).catch(e => console.warn('save failed', e));
  }, 1200);
}

async function initCaps() {
  if (!window.claude || !window.claude.use) return;
  try {
    const [user, db, sample] = await Promise.all([claude.use('user'), claude.use('db'), claude.use('sample')]);
    USER = user; DB = db; SAMPLE = sample;
    if (SAMPLE) document.body.classList.add('has-ai');
    if (USER) { try { isOwner = !!(await USER.isOwner()); } catch (e) {} }
    if (DB && USER) {
      const uid = await USER.id();
      if (uid) {
        DOC = DB.doc('results/' + uid);
        const snap = await DOC.get();
        if (snap.exists) {
          const remote = snap.data();
          if (remote && remote.answers && (remote.updatedAt || 0) >= (state.updatedAt || 0) - 1000) state = { ...state, ...JSON.parse(JSON.stringify(remote)) };
          else save();
        }
      }
    }
  } catch (e) { console.warn('caps', e); }
  renderAll();
}

// ================== progress ==================
function blockProgress(b) {
  const n = b.tasks.length, d = b.tasks.filter(t => ans(t.id).done).length;
  return { n, d, complete: n ? d === n : !!state.watched[b.id] };
}
function totals() {
  const ids = Object.keys(TASKS); const done = ids.filter(id => ans(id).done).length;
  const first = ids.filter(id => ans(id).firstTry === true).length;
  return { total: ids.length, done, first };
}

// ================== rendering ==================
function renderAll() { renderNav(); renderTop(); if (state.cur === 'parents') renderParents(); else renderBlock(); }

function renderTop() {
  const t = totals();
  $('#progress-text').textContent = `${t.done} из ${t.total} заданий`;
  $('#progress-bar').style.width = (100 * t.done / t.total) + '%';
  $('#stars').textContent = `★ ${t.first}`;
  $('#stars').title = 'Задания, решённые с первой попытки';
}

function renderNav() {
  const nav = $('#nav'); let h = '';
  ALL.forEach((b, i) => {
    const p = blockProgress(b);
    const num = b.id === 'intro' ? '▶' : (b.id === 'final' ? '✎' : (b.id === 'recap' ? '↺' : i));
    h += `<button class="nav-item ${state.cur === b.id ? 'active' : ''} ${p.complete ? 'complete' : ''}" data-b="${b.id}">
      <span class="nav-num">${p.complete ? '✓' : num}</span><span class="nav-txt"><b>${esc(b.title)}</b><small>${esc(b.lv)}</small></span>
      ${p.n ? `<span class="nav-cnt">${p.d}/${p.n}</span>` : ''}</button>`;
  });
  h += `<button class="nav-item parents ${state.cur === 'parents' ? 'active' : ''}" data-b="parents"><span class="nav-num">👤</span><span class="nav-txt"><b>Для родителей</b><small>Отчёт об ошибках</small></span></button>`;
  nav.innerHTML = h;
  nav.querySelectorAll('[data-b]').forEach(el => el.onclick = () => go(el.dataset.b));
}

function go(id) { state.cur = id; save(); renderAll(); $('#main').scrollTop = 0; }

function renderBlock() {
  const b = blockById(state.cur) || ALL[0], idx = ALL.indexOf(b);
  const main = $('#main');
  const hasVideo = !!b.video;
  if (b.id === 'recap' && !state.watched.recap) { state.watched.recap = true; save(); }
  let h = `<header class="bhead"><div class="kicker">${b.id === 'final' ? 'Финал' : (b.id === 'intro' ? 'Начало' : 'Блок ' + idx + ' из ' + (ALL.length - 3))}</div>
    <h1>${esc(b.title)}</h1><div class="lv">LV: ${esc(b.lv)}</div></header>`;
  if (hasVideo) h += `<div class="video-wrap"><video id="vid" controls preload="metadata" playsinline src="videos/${b.id}.mp4"></video></div>
    <div class="vid-note">${state.watched[b.id] ? '✓ Видео просмотрено' : 'Посмотри видео, потом прочитай конспект — и решай задания.'}</div>`;
  if (NOTES[b.id]) h += NOTES[b.id];
  if (b.id === 'recap') h += RECAP;
  if (b.id === 'final') h += `<div class="intro-card"><b>Это как настоящая контрольная.</b> Реши все задания сам. Если ошибёшься — увидишь разбор. Результат попадёт в отчёт для родителей.</div>`;
  if (b.tasks.length) {
    h += `<h2 class="tasks-h">Задания <span>${blockProgress(b).d}/${b.tasks.length}</span></h2>`;
    b.tasks.forEach((t, i) => { h += `<div class="task" id="t-${t.id}">${taskHTML(TASKS[t.id], i + 1)}</div>`; });
  } else if (b.id === 'intro') {
    h += `<div class="intro-card"><b>Как проходит урок:</b><ol><li>Смотри короткое видео в каждом блоке (голос объясняет всё по шагам).</li><li>Под видео — <b>конспект</b> с примерами из жизни и ловушками контрольной. Прочитай его!</li><li>Решай задания под видео. Если ошибёшься — увидишь, в чём ошибка, и попробуешь ещё раз.</li>${window.claude && window.claude.use ? '<li>Непонятно? Спроси учителя-ИИ в окне справа. Можно говорить голосом: нажми <kbd>Win</kbd> + <kbd>H</kbd> в поле вопроса.</li>' : '<li>Непонятно? Перечитай конспект под видео — там всё по шагам, с примерами. После ошибки появится подсказка, а после второй — полное решение.</li>'}<li>В конце — шпаргалка и пробная контрольная, как настоящая (тема 7.3).</li></ol></div>`;
  } else if (b.id === 'recap') {
    const t = totals();
    h += `<div class="intro-card"><b>Твой результат: ${t.done} из ${t.total} заданий решено, ★ ${t.first} с первой попытки.</b><br>Теперь попробуй пробную контрольную.</div>`;
  }
  const next = ALL[idx + 1];
  h += `<div class="nextbar">${idx > 0 ? `<button class="btn ghost" data-go="${ALL[idx - 1].id}">← Назад</button>` : '<span></span>'}
    ${next ? `<button class="btn primary" data-go="${next.id}">Дальше: ${esc(next.title)} →</button>` : `<button class="btn primary" data-go="parents">Посмотреть отчёт →</button>`}</div>`;
  main.innerHTML = h;
  main.querySelectorAll('[data-go]').forEach(el => el.onclick = () => go(el.dataset.go));
  const v = $('#vid');
  if (v) {
    v.addEventListener('ended', () => { state.watched[b.id] = true; save(); renderNav(); const n = $('.vid-note'); if (n) n.textContent = '✓ Видео просмотрено'; });
    v.addEventListener('error', () => { const n = $('.vid-note'); if (n) n.textContent = 'Видео не загрузилось. Обнови страницу.'; });
  }
  b.tasks.forEach(t => bindTask(TASKS[t.id]));
}

// ---------- tasks ----------
function getInst(t, fresh = false) {
  if (t.type !== 'num') return t;
  if (fresh || !inst[t.id]) inst[t.id] = t.gen();
  return inst[t.id];
}
function statusBadge(a) {
  if (a.done) return a.firstTry ? '<span class="badge ok">★ с первой попытки</span>' : '<span class="badge ok2">✓ решено</span>';
  if (a.attempts) return `<span class="badge try">попыток: ${a.attempts}</span>`;
  return '';
}
function taskHTML(t, n) {
  const a = ans(t.id), I = getInst(t), u = ui[t.id] || (ui[t.id] = {});
  if (!u.order && t.opts) { const idx = t.opts.map((_, i) => i); u.order = t.opts.every(o => o.t.length <= 2) ? idx : idx.sort(() => Math.random() - 0.5); }
  let h = `<div class="task-top"><span class="tnum">${n}</span><div class="tq"><div class="q-lv">${esc(I.lv)}</div><div class="q-ru">${esc(I.ru || '')}</div></div>${statusBadge(a)}</div>`;
  const fig = I.fig || t.fig; if (fig) h += `<div class="figbox">${fig}</div>`;
  if (t.type === 'choice') {
    h += `<div class="opts">` + (u.order || t.opts.map((_, i) => i)).map(i => {
      const o = t.opts[i]; const cls = a.done && o.ok ? 'right' : ((u.tried || []).includes(i) ? 'wrongopt' : '');
      return `<button class="opt ${cls}" data-i="${i}" ${a.done || (u.tried || []).includes(i) ? 'disabled' : ''}>${esc(o.t)}</button>`;
    }).join('') + `</div>`;
  } else if (t.type === 'multi') {
    h += `<div class="opts multi">` + u.order.map(i => [t.opts[i], i]).map(([o, i]) => `<label class="mopt ${a.done && o.ok ? 'right' : ''}"><input type="checkbox" data-i="${i}" ${a.done ? 'disabled' : ''} ${(a.done && o.ok) || (u.sel || []).includes(i) ? 'checked' : ''}><span>${esc(o.t)}</span></label>`).join('') + `</div>`;
    if (!a.done) h += `<button class="btn primary check">Проверить</button>`;
  } else if (t.type === 'num') {
    h += `<div class="numrow">` + I.fields.map((f, i) => `<label class="nf"><span>${esc(f.label)}</span><input inputmode="decimal" autocomplete="off" data-i="${i}" ${(a.done && !u.again) || u.solShown ? 'disabled' : ''} value="${esc((u.vals || [])[i] ?? (a.done && !u.again ? String(f.ans).replace('.', ',') : ''))}"><em>${esc(f.unit)}</em></label>`).join('') + `</div>`;
    if (!(a.done && !u.again) && !u.solShown) h += `<button class="btn primary check">Проверить</button>`;
  } else if (t.type === 'ai') {
    h += `<textarea class="aiin" rows="3" placeholder="Напиши ответ здесь… (можно надиктовать: Win + H)" ${a.done ? 'disabled' : ''}>${esc(u.text ?? a.text ?? '')}</textarea>`;
    if (t.symbols && !a.done) h += `<div class="symbar">${['∈', '∉', '∥', '⊥', '∢', '°', '='].map(s => `<button class="sym" data-s="${s}">${s}</button>`).join('')}</div>`;
    if (!a.done) h += `<div class="row"><button class="btn primary check">${document.body.classList.contains('has-ai') ? 'Проверить у учителя' : 'Сравнить с образцом'}</button>${(u.fails || 0) >= 2 ? '<button class="btn ghost showmodel">Показать образец</button>' : ''}</div>`;
  }
  h += `<div class="fb">${u.fb || (a.done ? doneText(t, I) : '')}</div>`;
  if (t.type === 'num' && u.solShown) h += `<button class="btn primary again">Новое похожее задание →</button>`;
  if (t.type === 'num' && a.done && !u.again && !u.solShown) h += `<button class="btn ghost small again">Ещё такое же для тренировки</button>`;
  return h;
}
function doneText(t, I) {
  if (t.type === 'num') return `<div class="good">✓ Верно! ${esc(I.solution)}</div>`;
  if (t.type === 'ai') return `<div class="good">✓ Засчитано.</div><div class="model"><b>Образец:</b> ${esc(t.model)}</div>`;
  return `<div class="good">✓ Верно! ${esc(t.explain || '')}</div>`;
}
function rerenderTask(t) {
  const el = $('#t-' + t.id); if (!el) return;
  const n = el.querySelector('.tnum')?.textContent || '';
  el.innerHTML = taskHTML(t, n); bindTask(t); renderTop(); renderNav();
  const th = $('.tasks-h span'); const b = blockById(t.block); if (th && b) th.textContent = `${blockProgress(b).d}/${b.tasks.length}`;
}
function record(t, correct, wrongText) {
  const a = ans(t.id);
  if (a.done && !(ui[t.id] || {}).again) return;
  if ((ui[t.id] || {}).again) { if (correct) { ui[t.id].again = false; ui[t.id].fb = ''; } return; }
  a.attempts++;
  if (correct) { a.done = true; if (a.firstTry === null) a.firstTry = a.attempts === 1; a.doneAt = Date.now(); }
  else { if (a.firstTry === null) a.firstTry = false; if (wrongText != null) a.wrong.push(String(wrongText).slice(0, 300)); a.wrong = a.wrong.slice(-8); }
  save();
}
function bindTask(t) {
  const el = $('#t-' + t.id); if (!el) return;
  const u = ui[t.id] || (ui[t.id] = {}); const I = getInst(t);
  const setLast = (txt) => { lastTask = t.id; lastAnswer = txt; };
  if (t.type === 'choice') {
    el.querySelectorAll('.opt').forEach(btn => btn.onclick = () => {
      const i = +btn.dataset.i, o = t.opts[i]; setLast(o.t);
      if (o.ok) { record(t, true); u.fb = ''; }
      else { record(t, false, o.t); (u.tried = u.tried || []).push(i); u.fb = `<div class="bad">✗ ${esc(o.fb || 'Неверно.')}</div><div class="hint">Попробуй выбрать другой ответ.</div>`; }
      rerenderTask(t);
    });
  }
  if (t.type === 'multi') {
    el.querySelectorAll('input[type=checkbox]').forEach(cb => cb.onchange = () => { u.sel = [...el.querySelectorAll('input:checked')].map(x => +x.dataset.i); });
    const c = el.querySelector('.check'); if (c) c.onclick = () => {
      const sel = [...el.querySelectorAll('input:checked')].map(x => +x.dataset.i); u.sel = sel;
      const wrongSel = sel.filter(i => !t.opts[i].ok), missed = t.opts.map((o, i) => i).filter(i => t.opts[i].ok && !sel.includes(i));
      setLast(sel.map(i => t.opts[i].t).join('; ') || '(ничего не выбрано)');
      if (!wrongSel.length && !missed.length) { record(t, true); u.fb = ''; }
      else {
        record(t, false, sel.map(i => t.opts[i].t).join('; ') || '—');
        u.fb = `<div class="bad">✗ Пока не совсем.</div>` + wrongSel.map(i => `<div class="bad-li">• «${esc(t.opts[i].t)}» — ${esc(t.opts[i].fb || 'это неверно.')}</div>`).join('')
          + (missed.length ? `<div class="bad-li">• Ты отметил не все верные утверждения${wrongSel.length ? '' : ' — найди ещё'}.</div>` : '') + `<div class="hint">Исправь и нажми «Проверить» ещё раз.</div>`;
      }
      rerenderTask(t);
    };
  }
  if (t.type === 'num') {
    el.querySelectorAll('.numrow input').forEach(inp => {
      inp.oninput = () => { u.vals = [...el.querySelectorAll('.numrow input')].map(x => x.value); };
      inp.onkeydown = e => { if (e.key === 'Enter') el.querySelector('.check')?.click(); };
    });
    const c = el.querySelector('.check'); if (c) c.onclick = () => {
      const raw = [...el.querySelectorAll('.numrow input')].map(x => x.value.trim()); u.vals = raw;
      const vals = raw.map(v => parseFloat(v.replace(',', '.').replace(/[^\d.\-]/g, '')));
      if (vals.some(v => isNaN(v))) { u.fb = '<div class="hint">Впиши число в каждое поле.</div>'; rerenderTask(t); return; }
      setLast(I.fields.map((f, i) => f.label + ' ' + raw[i]).join(', '));
      const ok = I.fields.every((f, i) => Math.abs(vals[i] - f.ans) < 0.011);
      if (ok) { record(t, true); u.fb = (u.again ? `<div class="good">✓ Верно! ${esc(I.solution)}</div>` : ''); u.again = false; u.solShown = false; u.tries = 0; }
      else {
        record(t, false, `${I.lv} → ${raw.join(' / ')}`);
        u.tries = (u.tries || 0) + 1;
        const m = I.wrong(vals.length === 1 ? vals[0] : vals);
        const partial = I.fields.length > 1 ? I.fields.map((f, i) => Math.abs(vals[i] - f.ans) < 0.011 ? `<div class="bad-li ok-li">✓ ${esc(f.label)} — верно</div>` : `<div class="bad-li">✗ ${esc(f.label)} — неверно</div>`).join('') : '';
        if (u.tries >= 2) { u.fb = `<div class="bad">✗ ${esc(m || 'Опять не то.')}</div>${partial}<div class="sol"><b>Решение:</b> ${esc(I.solution)}</div><div class="hint">Разберись в решении и реши похожее задание с другими числами.</div>`; u.solShown = true; }
        else u.fb = `<div class="bad">✗ ${esc(m || 'Пока неверно. Проверь вычисления и подумай, что складывать, а что вычитать.')}</div>${partial}<div class="hint">Попробуй ещё раз. Подсказка — в конспекте под видео.</div>`;
      }
      rerenderTask(t);
    };
    const ag = el.querySelector('.again'); if (ag) ag.onclick = () => { getInst(t, true); u.vals = []; u.fb = ''; u.solShown = false; u.tries = 0; if (ans(t.id).done) u.again = true; rerenderTask(t); };
  }
  if (t.type === 'ai') {
    const ta = el.querySelector('.aiin'); if (ta) ta.oninput = () => { u.text = ta.value; };
    el.querySelectorAll('.sym').forEach(s => s.onclick = () => { const p = ta.selectionStart ?? ta.value.length; ta.value = ta.value.slice(0, p) + s.dataset.s + ta.value.slice(ta.selectionEnd ?? p); u.text = ta.value; ta.focus(); ta.selectionStart = ta.selectionEnd = p + 1; });
    const sm = el.querySelector('.showmodel'); if (sm) sm.onclick = () => { u.fb = (u.fb || '') + `<div class="model"><b>Образец:</b> ${esc(t.model)}</div><div class="hint">Перепиши своими словами и проверь ещё раз.</div>`; rerenderTask(t); };
    const c = el.querySelector('.check'); if (c) c.onclick = async () => {
      const text = (ta.value || '').trim(); if (text.length < 3) { u.fb = '<div class="hint">Сначала напиши ответ.</div>'; rerenderTask(t); return; }
      setLast(text); ans(t.id).text = text;
      if (!SAMPLE) {
        u.fb = `<div class="model"><b>Образец:</b> ${esc(t.model)}</div><div class="hint">Сравни со своим ответом. Есть ли у тебя всё главное?</div><div class="row"><button class="btn primary selfok">Да, у меня так же</button><button class="btn ghost selfno">Нет, у меня по-другому</button></div>`;
        rerenderTask(t);
        const e2 = $('#t-' + t.id);
        e2.querySelector('.selfok').onclick = () => { record(t, true); u.fb = ''; rerenderTask(t); };
        e2.querySelector('.selfno').onclick = () => { record(t, false, text); u.fb = `<div class="model"><b>Образец:</b> ${esc(t.model)}</div><div class="hint">Исправь свой ответ по образцу и нажми ещё раз.</div>`; rerenderTask(t); };
        return;
      }
      c.disabled = true; c.textContent = 'Учитель проверяет…';
      try {
        const res = await aiCheck(t, text);
        if (res.ok) { record(t, true); u.fb = `<div class="good">✓ ${esc(res.feedback)}</div>`; }
        else { record(t, false, text); u.fails = (u.fails || 0) + 1; u.fb = `<div class="bad">✗ ${esc(res.feedback)}</div><div class="hint">Исправь ответ и проверь ещё раз.</div>`; }
      } catch (e) {
        u.fb = `<div class="hint">Не получилось связаться с учителем (${esc(e && (e.code || e.message) || 'ошибка')}). Попробуй ещё раз через минуту.</div>`;
      }
      rerenderTask(t);
    };
  }
}

function parseJSON(s) { const m = String(s).match(/\{[\s\S]*\}/); return m ? JSON.parse(m[0]) : null; }
async function aiCheck(t, text) {
  const prompt = `Ты проверяешь ответ ученика 7 класса (латвийская школа, ученик говорит по-русски) по математике (тема 7.3: зависимости между величинами, пропорциональность, графики, формулы).
Задание (на латышском): ${t.lv}
Перевод: ${t.ru}
Критерии проверки: ${t.rubric}
Образцовый ответ: ${t.model}
Ответ ученика: """${text}"""

Ответ ученика может быть на русском или латышском, с опечатками — опечатки не важны, важен смысл.
Верни ТОЛЬКО JSON без пояснений: {"ok": true или false, "feedback": "1–3 коротких предложения по-русски для ученика: если верно — похвали и коротко скажи почему; если нет — чего не хватает или что неверно, с подсказкой, но НЕ давай полный готовый ответ"}`;
  const r = await SAMPLE(prompt, { modelTier: 'default' });
  const j = parseJSON(r.text);
  if (!j || typeof j.ok !== 'boolean') throw new Error('bad answer');
  return { ok: j.ok, feedback: String(j.feedback || '') };
}

// ================== tutor chat ==================
const chat = [];
function tutorContext() {
  const b = blockById(state.cur);
  let c = `Ученик сейчас в блоке «${b ? b.title : 'Отчёт'}»${b ? ' (' + b.lv + ')' : ''}.`;
  if (lastTask && TASKS[lastTask]) {
    const t = TASKS[lastTask], I = getInst(t), a = ans(lastTask);
    c += ` Последнее задание, с которым он работал: «${I.lv}» (${I.ru || ''}). Его последний ответ: «${lastAnswer}». Статус: ${a.done ? 'решено верно' : 'пока не решено, попыток ' + a.attempts}.`;
    if (t.type === 'num' && !a.done) c += ` (Для тебя, не говори сразу: правильное решение — ${I.solution}.)`;
    if (t.type === 'choice' && !a.done) c += ` (Для тебя: верный вариант — «${t.opts.find(o => o.ok).t}».)`;
  }
  return c;
}
const TUTOR_RULES = `Ты — добрый и терпеливый репетитор по математике для ученика 7 класса латвийской школы. Ученик говорит по-русски, но в школе учит математику на латышском. Тема урока 7.3: «Kā raksturo sakarību starp mainīgiem lielumiem?» — постоянные и переменные величины (nemainīgie/mainīgie lielumi), независимая и зависимая переменная (neatkarīgais/atkarīgais mainīgais), прямая пропорциональность (tieši proporcionāli, y = kx, частное постоянно, коэффициент), обратная пропорциональность (apgriezti proporcionāli, y = k/x, произведение постоянно; в b = 60/a значение a не может быть 0 и отрицательным), чтение графика (Зана: 4 мин — 300 м, 8–12 мин стояла), построение графика (подписи осей, ровный масштаб, точки, линейка; краны 10 и 20 мл/с), формула вида S = 9,5n + 5 (футболки). Ученик плохо понимает тему — объясняй очень просто, по шагам, с примерами из жизни (самокат, мороженое, пицца, такси, зарядка телефона).
Правила:
- Отвечай по-русски, коротко (2–5 предложений), простыми словами, как живой учитель. Латышский термин добавляй в скобках.
- Если ученик спрашивает ответ на задание, не выдавай его сразу: дай подсказку или наводящий вопрос. Полное решение объясняй, только если он уже пробовал и всё равно не понимает (или прямо просит объяснить решение после ошибок).
- Формулы пиши обычным текстом: S = 0,10 · t, b = 60 : a, S = 9,5n + 5.
- Если вопрос не про урок, мягко верни к теме.
- Подбадривай, никогда не ругай.`;

async function sendChat(q) {
  q = q.trim(); if (!q) return;
  chat.push({ role: 'user', content: q });
  state.questions.push({ q: q.slice(0, 300), block: state.cur, task: lastTask, ts: Date.now() }); state.questions = state.questions.slice(-60); save();
  let msgs = chat.slice(-10).map(m => ({ role: m.role, content: m.content }));
  while (msgs.length && msgs[0].role !== 'user') msgs.shift();
  msgs[msgs.length - 1].content = `[Контекст: ${tutorContext()}]\n\nВопрос ученика: ${q}`;
  msgs[0].content = TUTOR_RULES + '\n\n' + msgs[0].content;
  const bubble = { role: 'assistant', content: '…' }; chat.push(bubble); renderChat();
  if (!SAMPLE) { bubble.content = 'Учитель-ИИ работает, только когда урок открыт в claude.ai. Пока можешь пересмотреть видео или прочитать объяснение под заданием.'; renderChat(); return; }
  try {
    const r = await SAMPLE(msgs, { modelTier: 'default', cache: false, onText: ({ text }) => { bubble.content = text; renderChat(true); } });
    bubble.content = r.text || bubble.content;
  } catch (e) {
    bubble.content = e && e.code === 'rate_limited' ? 'Сейчас слишком много вопросов подряд. Подожди минутку и спроси снова.' : 'Не получилось ответить. Попробуй ещё раз.';
  }
  renderChat();
}
function md(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>'); }
function renderChat(stream) {
  const box = $('#chatlog');
  if (!chat.length) { box.innerHTML = `<div class="chat-empty">Привет! Я учитель-ИИ. Спроси меня, если что-то непонятно в видео или в задании. Например: <i>«Как понять, что от чего зависит?»</i></div>`; return; }
  box.innerHTML = chat.map((m, i) => `<div class="msg ${m.role}">${md(m.content)}${m.role === 'assistant' && m.content.length > 3 ? `<button class="say" data-i="${i}" title="Прочитать вслух">🔊</button>` : ''}</div>`).join('');
  box.querySelectorAll('.say').forEach(b => b.onclick = () => speak(chat[+b.dataset.i].content));
  box.scrollTop = box.scrollHeight;
}
function speak(text) {
  try {
    if (!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const clean = text.replace(/∢/g, 'угол ').replace(/°/g, ' градусов').replace(/∈/g, ' принадлежит ').replace(/∉/g, ' не принадлежит ').replace(/∥/g, ' параллельна ').replace(/⊥/g, ' перпендикулярна ').replace(/\*\*/g, '');
    const u = new SpeechSynthesisUtterance(clean); u.lang = 'ru-RU'; u.rate = 0.95;
    const v = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('ru'));
    const best = v.find(x => /dmitry|svetlana|natural|google/i.test(x.name)) || v[0]; if (best) u.voice = best;
    speechSynthesis.speak(u);
  } catch (e) {}
}

// ================== parents ==================
function reportFor(st) {
  const lines = [];
  ALL.forEach(b => {
    if (!b.tasks.length) return;
    const rows = b.tasks.map(t => { const a = (st.answers || {})[t.id] || { attempts: 0, wrong: [] }; return { t: TASKS[t.id], a }; });
    lines.push({ b, rows, err: rows.reduce((s, r) => s + Math.max(0, (r.a.attempts || 0) - (r.a.done ? 1 : 0)), 0) });
  });
  return lines;
}
function taskLabel(t) { return t.type === 'num' ? (t.gen().lv.replace(/\d+([.,]\d+)?/g, '…')) : t.lv; }
async function renderParents() {
  const main = $('#main');
  main.innerHTML = `<header class="bhead"><div class="kicker">Для родителей</div><h1>Отчёт об уроке</h1><div class="lv">Ошибки по темам, неверные ответы и что объяснить дополнительно</div></header><div id="reports">Загрузка…</div>`;
  let learners = [{ name: 'Этот компьютер', st: state }];
  if (DB && isOwner) {
    try {
      const qs = await DB.collection('results').get();
      if (qs.size) learners = qs.docs.map((d, i) => ({ name: qs.size > 1 ? 'Ученик ' + (i + 1) : 'Ученик', st: d.data() }));
    } catch (e) { console.warn(e); }
  }
  const out = learners.map((L, li) => {
    const st = L.st; const rep = reportFor(st); const ids = Object.keys(TASKS);
    const done = ids.filter(id => st.answers?.[id]?.done).length, first = ids.filter(id => st.answers?.[id]?.firstTry === true).length;
    const errs = rep.reduce((s, r) => s + r.err, 0);
    const watched = ALL.filter(b => b.video && st.watched?.[b.id]).length;
    let h = `<section class="rep"><h2>${esc(L.name)}</h2>
      <div class="kpis"><div><b>${done}/${ids.length}</b><span>заданий решено</span></div><div><b>${first}</b><span>с первой попытки</span></div><div><b>${errs}</b><span>ошибок всего</span></div><div><b>${watched}/${ALL.filter(b => b.video).length}</b><span>видео досмотрено</span></div></div>
      <table class="reptab"><thead><tr><th>Тема</th><th>Решено</th><th>Ошибок</th><th>Неверные ответы</th></tr></thead><tbody>`;
    rep.forEach(r => {
      const d = r.rows.filter(x => x.a.done).length;
      const wrongs = r.rows.filter(x => (x.a.wrong || []).length).map(x => `<div class="wr"><b>${esc(taskLabel(x.t).slice(0, 90))}</b><br>${x.a.wrong.slice(-3).map(w => '✗ ' + esc(w.slice(0, 140))).join('<br>')}</div>`).join('');
      h += `<tr class="${r.err >= 3 ? 'hot' : (r.err ? 'warm' : '')}"><td><b>${esc(r.b.title)}</b><br><small>${esc(r.b.lv)}</small></td><td>${d}/${r.rows.length}</td><td>${r.err}</td><td>${wrongs || '—'}</td></tr>`;
    });
    h += `</tbody></table>`;
    if ((st.questions || []).length) h += `<h3>Вопросы ученика учителю-ИИ</h3><ul class="qs">${st.questions.slice(-15).map(q => `<li>${esc(q.q)} <small>(${esc(blockById(q.block)?.title || '')})</small></li>`).join('')}</ul>`;
    h += `<div class="row"><button class="btn primary analyze" data-l="${li}">Что объяснить дополнительно? (анализ ИИ)</button></div><div class="analysis" id="an-${li}"></div></section>`;
    return h;
  }).join('');
  $('#reports').innerHTML = out + `<section class="rep muted-sec"><h3>Начать урок заново</h3><p>Стирает ответы на этом аккаунте. Отчёт тоже очистится.</p><button class="btn ghost" id="reset">Сбросить прогресс</button></section>`;
  document.querySelectorAll('.analyze').forEach(b => b.onclick = () => analyze(learners[+b.dataset.l].st, +b.dataset.l, b));
  const rs = $('#reset'); rs.onclick = () => {
    if (rs.dataset.armed) { state = { answers: {}, watched: {}, cur: 'intro', questions: [], startedAt: Date.now(), updatedAt: Date.now() }; Object.keys(ui).forEach(k => delete ui[k]); save(); renderAll(); return; }
    rs.dataset.armed = 1; rs.textContent = 'Точно сбросить? Нажми ещё раз';
  };
}
async function analyze(st, li, btn) {
  const box = $('#an-' + li);
  if (!SAMPLE) { box.innerHTML = '<div class="hint">Анализ ИИ работает, когда страница открыта в claude.ai.</div>'; return; }
  const rep = reportFor(st).map(r => `${r.b.title} (${r.b.lv}): решено ${r.rows.filter(x => x.a.done).length}/${r.rows.length}, ошибок ${r.err}` + r.rows.filter(x => (x.a.wrong || []).length).map(x => `\n  - задание «${taskLabel(x.t).slice(0, 120)}»: неверные ответы: ${(x.a.wrong || []).slice(-3).join(' | ')}`).join('')).join('\n');
  const qs = (st.questions || []).slice(-15).map(q => '- ' + q.q).join('\n');
  btn.disabled = true; box.innerHTML = '<div class="hint">Анализирую…</div>';
  try {
    const r = await SAMPLE(`Ты опытный учитель математики. Ниже результаты ученика 7 класса (латвийская школа, русскоязычный) по уроку 7.3 «Kā raksturo sakarību starp mainīgiem lielumiem?» (переменные, прямая и обратная пропорциональность, графики, формулы). Напиши отчёт для РОДИТЕЛЯ по-русски, простым языком, без воды:
1) Что получилось хорошо (1–2 пункта).
2) Где ошибки и в чём, судя по неверным ответам, непонимание (конкретно, 2–5 пунктов).
3) Что объяснить дополнительно перед контрольной — конкретные темы и 1–2 коротких примера-упражнения, которые родитель может дать сам (с ответами).
Если данных мало (ученик решил мало заданий), так и скажи.

Результаты:
${rep}

Вопросы ученика учителю-ИИ:
${qs || '(нет)'}`, { modelTier: 'default', onText: ({ text }) => { box.innerHTML = `<div class="analysis-text">${md(text)}</div>`; } });
    box.innerHTML = `<div class="analysis-text">${md(r.text)}</div>`;
  } catch (e) { box.innerHTML = '<div class="hint">Не получилось. Попробуй ещё раз через минуту.</div>'; }
  btn.disabled = false;
}

// ================== boot ==================
function boot() {
  if (!(window.claude && window.claude.use)) document.body.classList.add('no-ai');
  renderAll(); renderChat();
  const f = $('#chatform'), inp = $('#chatin');
  f.onsubmit = e => { e.preventDefault(); const q = inp.value; inp.value = ''; sendChat(q); };
  inp.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); f.requestSubmit(); } };
  $('#chat-toggle').onclick = () => document.body.classList.toggle('chat-open');
  document.querySelectorAll('.quick').forEach(b => b.onclick = () => sendChat(b.textContent));
  if (window.speechSynthesis) speechSynthesis.getVoices();
  initCaps();
}
document.addEventListener('DOMContentLoaded', boot);
